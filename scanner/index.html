<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="문서를 사진으로 찍으면 스캔한 것처럼 반듯하게 펴서 PDF 로 만들어 주는 웹앱">
<title>스캔메이트 · 사진을 PDF 스캔본으로</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="스캔메이트">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- 홈: 지금까지 모은 페이지 -->
  <header class="topbar">
    <h1>스캔메이트</h1>
    <span class="dim" id="count"></span>
    <button class="btn ghost small" id="clearAll" hidden>모두 지우기</button>
  </header>

  <main id="home" class="home">
    <div id="empty" class="empty">
      <svg viewBox="0 0 64 64" class="empty-ico" aria-hidden="true">
        <path d="M8 20V12a4 4 0 0 1 4-4h8M44 8h8a4 4 0 0 1 4 4v8M56 44v8a4 4 0 0 1-4 4h-8M20 56h-8a4 4 0 0 1-4-4v-8"/>
        <rect x="20" y="16" width="24" height="32" rx="2"/>
        <path d="M25 25h14M25 31h14M25 37h9"/>
      </svg>
      <h2>문서를 찍어 보세요</h2>
      <p>찍은 사진에서 문서 테두리를 찾아 반듯하게 펴고,<br>스캔한 것처럼 바탕을 하얗게 만들어 PDF 로 저장해요.</p>
      <ul class="tips">
        <li>문서보다 <b>어두운 바닥</b>에 놓고 찍으면 테두리를 잘 찾아요</li>
        <li>네 모서리가 모두 화면에 들어오게 찍어 주세요</li>
        <li>여러 장을 찍어 한 PDF 로 묶을 수 있어요</li>
      </ul>
    </div>
    <ol id="pages" class="grid"></ol>
  </main>

  <nav class="bar">
    <label class="btn primary grow">
      <input type="file" accept="image/*" capture="environment" id="camIn" hidden>
      <span>촬영</span>
    </label>
    <label class="btn grow">
      <input type="file" accept="image/*" multiple id="galIn" hidden>
      <span>앨범에서</span>
    </label>
    <button class="btn accent grow" id="toPdf" disabled>PDF 만들기</button>
  </nav>

  <!-- 모서리 맞추기 -->
  <section id="crop" class="screen" hidden>
    <div class="screen-top">
      <button class="btn ghost" data-close>취소</button>
      <span class="screen-title">모서리를 맞춰 주세요</span>
      <button class="btn primary" id="cropNext">다음</button>
    </div>
    <div class="stage" id="cropStage">
      <canvas id="cropCanvas"></canvas>
      <canvas id="loupe" class="loupe" hidden></canvas>
    </div>
    <div class="screen-bottom">
      <button class="btn" id="cropAuto">자동 찾기</button>
      <button class="btn" id="cropFull">사진 전체</button>
    </div>
  </section>

  <!-- 보정 -->
  <section id="edit" class="screen" hidden>
    <div class="screen-top">
      <button class="btn ghost" data-close>취소</button>
      <span class="screen-title" id="editTitle">새 페이지</span>
      <button class="btn primary" id="editDone">완료</button>
    </div>
    <div class="stage"><canvas id="editCanvas"></canvas></div>
    <div class="screen-bottom col">
      <div class="chips" id="filters">
        <button data-f="color">선명하게</button>
        <button data-f="gray">회색조</button>
        <button data-f="bw">흑백</button>
        <button data-f="original">원본</button>
      </div>
      <div class="tools">
        <button class="btn" id="editRecrop">다시 자르기</button>
        <button class="btn" id="editRotate">회전</button>
        <button class="btn" id="editLeft" title="앞으로">◀</button>
        <button class="btn" id="editRight" title="뒤로">▶</button>
        <button class="btn danger" id="editDelete">삭제</button>
      </div>
    </div>
  </section>

  <!-- PDF 저장 -->
  <section id="pdf" class="screen sheet-wrap" hidden>
    <div class="sheet">
      <h2>PDF 만들기</h2>
      <label class="field">
        <span>파일 이름</span>
        <input type="text" id="pdfName" autocomplete="off">
      </label>
      <div class="field">
        <span>페이지 크기</span>
        <div class="seg" id="pdfSize">
          <button data-v="a4" class="on">A4</button>
          <button data-v="fit">사진 비율 그대로</button>
        </div>
      </div>
      <div class="field">
        <span>화질</span>
        <div class="seg" id="pdfQuality">
          <button data-v="0.72">작은 용량</button>
          <button data-v="0.86" class="on">보통</button>
          <button data-v="0.95">고화질</button>
        </div>
      </div>
      <p class="dim" id="pdfInfo"></p>
      <div class="sheet-actions">
        <button class="btn ghost" data-close>닫기</button>
        <button class="btn" id="pdfShare" hidden>공유하기</button>
        <button class="btn accent" id="pdfSave">내려받기</button>
      </div>
    </div>
  </section>

  <div id="busy" class="busy" hidden><div class="spinner"></div><span id="busyText">처리 중…</span></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/scan.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
