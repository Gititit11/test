<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="헬스 머신·프리웨이트를 검색해 나만의 루틴을 만들고, 세트를 완료할 때마다 체크하는 운동 보조 앱">
<title>GymMate · 헬스 루틴 &amp; 세트 체크</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymMate">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- 앱을 완전히 껐다 켰을 때만 보이는 인트로.
       markup 을 여기 두는 이유는 첫 페인트에 바로 나오게 하기 위해서다.
       app.js 를 기다리면 빈 화면이 한 번 스친다. -->
  <div id="intro" class="intro" hidden aria-hidden="true">
    <svg class="intro-mark" viewBox="0 0 200 104">
      <g class="intro-bar-g">
        <rect class="intro-bar" x="22" y="47" width="156" height="10" rx="5"/>
        <rect class="intro-plate in  l" x="52"  y="24" width="15" height="56" rx="6"/>
        <rect class="intro-plate out l" x="36"  y="33" width="12" height="38" rx="5"/>
        <rect class="intro-plate in  r" x="133" y="24" width="15" height="56" rx="6"/>
        <rect class="intro-plate out r" x="152" y="33" width="12" height="38" rx="5"/>
      </g>
    </svg>
    <div class="intro-word">GymMate</div>
  </div>
  <script>
    /* 인트로를 띄울지 첫 페인트 전에 정한다.
       sessionStorage 는 앱(탭)을 완전히 닫으면 지워지고, 새로고침이나
       안드로이드가 메모리에서 잠시 내렸다 복구할 때는 남는다. 그래서
       "휴식 중에 유튜브 보고 돌아옴" 과 "앱을 껐다가 다시 켬" 이 갈린다. */
    (function () {
      var el = document.getElementById('intro');
      try {
        var seen = sessionStorage.getItem('gm.intro');
        sessionStorage.setItem('gm.intro', '1');
        if (seen) return;
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        // 운동 중이면 건너뛴다. 세트를 적으러 급히 들어온 사람을 붙잡지 않는다
        var raw = localStorage.getItem('gymmate.v1');
        if (raw && /"active"\s*:\s*\{/.test(raw)) return;
        el.hidden = false;
      } catch (e) { /* 저장소가 막혀 있으면 그냥 건너뛴다 */ }
    })();
  </script>

  <div id="app"></div>
  <div id="modal" class="modal"></div>
  <div id="toast" class="toast-root"></div>

  <script src="js/exercises.js"></script>
  <script src="js/store.js"></script>
  <script src="js/calories.js"></script>
  <script src="js/bodyfigure.js"></script>
  <script src="js/bodymap.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      var hadController = !!navigator.serviceWorker.controller;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // 인트로가 도는 동안 새 버전을 확인한다. 어차피 기다리는 시간이라
          // 여기 얹으면 사용자가 따로 기다릴 일이 없다. 화면에는 아무것도 알리지 않는다.
          if (reg && reg.update) reg.update();
        }).catch(function () { /* 오프라인 캐시 미지원 */ });
      });
      // 새 버전이 설치되면 새로고침해 최신 코드로 바꾼다.
      // 단, 운동 중이라면 진행을 끊지 않도록 그대로 둔다.
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (hadController && !(window.Store && window.Store.active())) location.reload();
      });
    }
  </script>
</body>
</html>
