<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="짐메이트(헬스 루틴)와 마중물(물 마시기 기록) — 설치해서 쓰는 웹앱 두 개">
<title>앱 고르기</title>
<style>
  :root { --bg:#0f1115; --card:#1b2029; --line:#2c3240; --text:#eef1f6; --dim:#93a0b4;
          --gym:#4d7cff; --water:#38b6ff; --warn:#ffc857;
          --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(120% 60% at 50% -10%, #1a2233 0%, rgba(26,34,51,0) 60%), var(--bg);
    color: var(--text); min-height: 100vh; min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
      "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: calc(28px + var(--safe-t)) 18px calc(28px + var(--safe-b));
  }
  .wrap { width: 100%; max-width: 420px; }
  h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--dim); font-size: 13.5px; margin: 0 0 20px; }
  a.app {
    display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 12px; transition: border-color .15s ease, transform .12s ease;
  }
  a.app:active { transform: scale(.99); }
  a.app.gym:hover { border-color: var(--gym); }
  a.app.water:hover { border-color: var(--water); }
  .ico { width: 52px; height: 52px; border-radius: 14px; flex: none; background: #0b1016;
         display: flex; align-items: center; justify-content: center; }
  .ico img { width: 52px; height: 52px; border-radius: 14px; display: block; }
  a.app > span:not(.ico):not(.go) { min-width: 0; }
  .name, .desc { display: block; }
  .name { font-weight: 700; font-size: 16px; }
  .desc { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .go { margin-left: auto; color: var(--dim); font-size: 20px; flex: none; }
  .note {
    margin-top: 18px; padding: 14px; border-radius: 14px; font-size: 13px; line-height: 1.65;
    border: 1px solid var(--line); color: var(--dim); background: rgba(255,255,255,0.02);
  }
  .note b { color: var(--text); }
  #moved { display: none; border-color: rgba(255,200,87,0.35); background: rgba(255,200,87,0.07); color: var(--warn); }
  #moved b { color: var(--warn); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>앱 고르기</h1>
    <p class="sub">둘 다 설치해서 쓰는 웹앱이에요. 열어서 홈 화면에 추가하세요.</p>

    <!-- 예전 짐메이트 아이콘(주소가 /test/ 였던 것)으로 들어온 사람에게만 보인다 -->
    <div class="note" id="moved">
      <b>짐메이트 주소가 바뀌었어요.</b><br>
      두 앱이 서로의 설치를 방해하던 문제를 고치면서 짐메이트가 한 칸 안으로 들어갔어요.
      아래에서 짐메이트를 연 다음 <b>홈 화면에 다시 추가</b>해 주세요.
      기록은 그대로 남아 있어요.
    </div>

    <a class="app gym" href="./gymmate/">
      <span class="ico"><img src="./gymmate/icons/icon-192.png" alt="" width="52" height="52"></span>
      <span>
        <span class="name">짐메이트</span>
        <span class="desc">헬스 루틴을 만들고 세트마다 체크</span>
      </span>
      <span class="go">›</span>
    </a>

    <a class="app water" href="./majungmul/">
      <span class="ico"><img src="./majungmul/icons/icon-192.png" alt="" width="52" height="52"></span>
      <span>
        <span class="name">마중물</span>
        <span class="desc">마신 물을 기록하고 제때 알림</span>
      </span>
      <span class="go">›</span>
    </a>

    <div class="note">
      <b>홈 화면에 추가하는 법</b><br>
      아이폰 사파리 — 공유 버튼 → 홈 화면에 추가<br>
      안드로이드 크롬 — 오른쪽 위 ⋮ → 앱 설치<br>
      앱마다 따로 추가하면 아이콘이 각각 생겨요.
    </div>
  </div>

  <script>
    /* 예전 짐메이트 아이콘은 이 주소(/test/)를 열도록 저장돼 있다.
       그 아이콘으로 들어오면 전체화면(standalone)으로 뜨므로, 그때만
       주소가 바뀌었다고 알려 준다. 브라우저로 그냥 온 사람에게는 필요 없는 말이다. */
    (function () {
      var standalone = false;
      try {
        standalone = matchMedia('(display-mode: standalone)').matches ||
                     matchMedia('(display-mode: fullscreen)').matches ||
                     navigator.standalone === true;
      } catch (e) { }
      if (standalone) document.getElementById('moved').style.display = 'block';
    })();

    /* 예전에 이 주소에 있던 짐메이트의 서비스워커를 걷어낸다.
       그대로 두면 낡은 화면이 캐시에서 계속 나온다. */
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) {
          // 각 앱이 자기 폴더에서 등록한 것은 건드리지 않는다
          if (r.scope.replace(location.origin, '').replace(/\/$/, '') ===
              location.pathname.replace(/\/$/, '')) r.unregister();
        });
      }).catch(function () { });
    }
  </script>
</body>
</html>
