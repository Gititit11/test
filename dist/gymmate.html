<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="헬스 머신·프리웨이트를 검색해 나만의 루틴을 만들고, 세트를 완료할 때마다 체크하는 운동 보조 앱">
<title>GymMate · 헬스 루틴 &amp; 세트 체크</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymMate">
<style>
/* GymMate — 모바일 우선 다크 테마 */
:root {
  --bg: #0f1115;
  --bg-2: #161a21;
  --card: #1b2029;
  --card-2: #222836;
  --line: #2c3240;
  --text: #eef1f6;
  --dim: #93a0b4;
  --brand: #4d7cff;
  --brand-2: #6c93ff;
  --ok: #35c98a;
  --danger: #ff5f6d;
  --radius: 14px;
  --tab-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
    "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }
h1 { font-size: 19px; }
h3 { font-size: 16px; }
p { margin: 2px 0 0; }
a { color: inherit; text-decoration: none; }
.dim { color: var(--dim); font-size: 13px; }
.center { text-align: center; }
.right { margin-left: auto; }

/* 레이아웃 */
#app { max-width: 640px; margin: 0 auto; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px;
  background: rgba(15, 17, 21, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-actions { display: flex; gap: 6px; flex: none; }
.page {
  padding: 14px 14px calc(var(--tab-h) + 96px + var(--safe-b));
  display: flex; flex-direction: column; gap: 12px;
}

/* 카드 */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; }
.row.between { justify-content: space-between; }
.row.gap { gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.chev { color: var(--dim); font-size: 22px; flex: none; }

/* 버튼 */
.btn {
  appearance: none;
  background: var(--card-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: transform .06s ease, background .15s ease;
}
.btn:active { transform: scale(.97); }
.btn.sm { padding: 7px 10px; font-size: 13px; }
.btn.lg { padding: 16px; font-size: 16px; }
.btn.block { width: 100%; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:active { background: var(--brand-2); }
.btn.danger { color: var(--danger); border-color: #43303a; }
.btn.ghost { background: transparent; }
.icon {
  background: transparent; border: 0; color: var(--dim);
  font-size: 16px; cursor: pointer; padding: 6px; border-radius: 8px;
}
.icon.danger { color: var(--danger); }

/* 배지 */
.badge {
  display: inline-block;
  background: var(--card-2);
  border: 1px solid var(--line);
  color: var(--dim);
  border-radius: 999px;
  padding: 3px 9px;
  font-size: 12px;
  margin: 0 6px 6px 0;
}
.badge.part { color: #9fc0ff; border-color: #2d3a5c; }
.badge.equip { color: #ffd28a; border-color: #4a3c22; }
.badge.mine { color: var(--ok); border-color: #24483a; }
.tags { margin-top: 6px; }
.tags .badge { margin-bottom: 0; }

/* 루틴 카드 */
.routine-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; gap: 8px; }
.routine-preview { margin-top: 10px; }
.routine-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.routine-actions .btn { flex: 1; min-width: 0; padding: 10px 6px; font-size: 13px; white-space: nowrap; }
.routine-actions .btn.primary { flex: 1.35; }

.card.live {
  display: flex; align-items: center; gap: 12px;
  border-color: var(--brand); background: linear-gradient(180deg, #1c2740, var(--card));
  cursor: pointer;
}
.live-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none;
  box-shadow: 0 0 0 0 rgba(53, 201, 138, .6);
  animation: pulse 1.8s infinite;
}
.card.live > div:nth-child(2) { flex: 1; }
@keyframes pulse {
  70% { box-shadow: 0 0 0 12px rgba(53, 201, 138, 0); }
  100% { box-shadow: 0 0 0 0 rgba(53, 201, 138, 0); }
}

/* 폼 */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.field:last-child { margin-bottom: 0; }
.field > span { font-size: 12px; color: var(--dim); }
.field.inline { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.field.inline > span { flex: none; }
.field.inline.grow { flex: 1; }
input[type=text], input[type=number], input[type=search], select {
  background: var(--bg-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 15px;
  font-family: inherit;
  width: 100%;
  min-width: 0;
}
.field.inline input[type=number], .field.inline select { width: 110px; text-align: right; }
input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--brand); }

/* 루틴 항목 */
.item-head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.item-no {
  width: 26px; height: 26px; flex: none;
  display: grid; place-items: center;
  background: var(--card-2); border-radius: 8px;
  font-size: 13px; color: var(--dim); font-weight: 700;
}
.item-main { flex: 1; min-width: 0; }
.item-main h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-body { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }

/* 세트 행 */
.setlist { display: flex; flex-direction: column; gap: 8px; }
.setrow {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.setrow.static { justify-content: space-between; }
.setno { font-size: 12px; color: var(--dim); flex: none; min-width: 34px; font-weight: 700; }
.mini { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
.mini input { text-align: right; padding: 8px 8px; }
.mini > span { font-size: 12px; color: var(--dim); flex: none; }
.x { color: var(--dim); flex: none; }
.mini.restedit { flex: 0 0 auto; gap: 4px; }
.mini.restedit input { width: 68px; text-align: center; padding: 7px 6px; }

/* 운동 진행 */
.progress-card { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 58px; z-index: 10; }
.bar { height: 8px; background: var(--bg-2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--brand), var(--ok)); transition: width .25s ease; }
.exercise { display: flex; flex-direction: column; gap: 10px; }
.exercise.done { border-color: #24483a; }
.exercise .memo { font-style: italic; }
.setrow.live.checked { background: rgba(53, 201, 138, .10); border-color: #2b6a52; }
.setrow.live.checked input { color: var(--dim); }
.check {
  flex: none;
  width: 44px; height: 44px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--card-2);
  color: #fff; font-size: 20px; font-weight: 800;
  cursor: pointer;
  display: grid; place-items: center;
  transition: transform .08s ease, background .15s ease;
}
.check:active { transform: scale(.9); }
.check.on { background: var(--ok); border-color: var(--ok); color: #06301f; }

/* 기록 통계 */
.stats { display: flex; justify-content: space-around; text-align: center; }
.stats > div { display: flex; flex-direction: column; gap: 2px; }
.stats strong { font-size: 22px; }

/* 근육 지도 */
.bodymap { display: flex; flex-direction: column; gap: 10px; }
.bm-figs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bm-fig { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bm-fig figcaption { font-size: 11px; color: var(--dim); letter-spacing: .08em; }
.bm-svg { width: 100%; height: auto; max-height: 340px; display: block; }
.bm-base { fill: #2a3140; }
.bm-muscles { stroke: #161a22; stroke-width: 1; stroke-linejoin: round; }
.bm-lines { fill: none; stroke: rgba(10,13,18,.5); stroke-width: 1.2; stroke-linecap: round; pointer-events: none; }
.bm-m { cursor: pointer; transition: opacity .15s ease; }
.bm-m:hover { opacity: .85; }
.bm-m.bm-on { stroke: var(--text); stroke-width: 1.6; paint-order: stroke; }

.bm-legend { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 12px; }
.bm-legend i { width: 20px; height: 10px; border-radius: 2px; display: inline-block; }
.bm-legend .bm-idle { display: flex; align-items: center; gap: 4px; margin-left: auto; color: var(--dim); }

.bm-detail {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px;
}
.bm-rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.bm-row {
  display: grid; grid-template-columns: 74px 1fr 34px;
  align-items: center; gap: 8px; cursor: pointer;
  padding: 3px 4px; border-radius: 8px;
}
.bm-row.on { background: var(--bg-2); }
.bm-name { font-size: 13px; color: var(--dim); }
.bm-row.on .bm-name { color: var(--text); }
.bm-bar { height: 10px; background: var(--bg-2); border-radius: 5px; overflow: hidden; }
.bm-bar i { display: block; height: 100%; border-radius: 5px; }
.bm-val { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }

/* 빈 상태 */
.empty { text-align: center; padding: 40px 16px; color: var(--dim); }
.empty.small { padding: 24px; }
.empty-ico { font-size: 34px; margin-bottom: 8px; }

/* 하단 탭 */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--tab-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  display: flex;
  background: rgba(22, 26, 33, .96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 11px; color: var(--dim); font-weight: 600;
}
.tab.on { color: var(--brand-2); }
.tab-ico { font-size: 19px; line-height: 1; }

/* 휴식 타이머 바 */
.restbar {
  position: fixed; left: 0; right: 0; z-index: 25;
  bottom: calc(var(--tab-h) + var(--safe-b));
  max-width: 640px; margin: 0 auto;
  overflow: hidden;
  transform: translateY(110%);
  transition: transform .25s ease;
  background: var(--card-2);
  border-top: 1px solid var(--brand);
}
.restbar.show { transform: translateY(0); }
.rest-fill {
  position: absolute; inset: 0 auto 0 0;
  background: rgba(77, 124, 255, .18);
  transition: width 1s linear;
}
.rest-inner { position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.rest-mid { flex: 1; display: flex; flex-direction: column; align-items: center; }
.rest-time { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.rest-label { font-size: 11px; color: var(--dim); }
.rest-btn {
  background: var(--card); border: 1px solid var(--line); color: var(--text);
  border-radius: 9px; padding: 8px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: inherit; flex: none;
}
.rest-btn.ghost { color: var(--dim); }

/* 운동 검색 시트 */
.modal { position: fixed; inset: 0; z-index: 50; display: none; }
.modal.show { display: block; }
.sheet-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-width: 640px; margin: 0 auto;
  max-height: 92vh;
  display: flex; flex-direction: column;
  background: var(--bg);
  border-radius: 18px 18px 0 0;
  border: 1px solid var(--line);
  padding-bottom: var(--safe-b);
  animation: up .22s ease;
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
.sheet > * { flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.sheet-search { padding: 0 14px 10px; }
.chiprow { display: flex; align-items: center; gap: 6px; padding: 0 14px 8px; overflow-x: auto; scrollbar-width: none; }
.chiprow::-webkit-scrollbar { display: none; }
.chiprow-label { font-size: 11px; color: var(--dim); flex: none; width: 30px; }
.fchip {
  flex: none; background: var(--card); border: 1px solid var(--line); color: var(--dim);
  border-radius: 999px; padding: 6px 11px; font-size: 13px; cursor: pointer; font-family: inherit;
}
.fchip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.sheet-default { padding: 6px 14px 10px; font-size: 13px; color: var(--dim); }
.sheet-default input { width: 56px; display: inline-block; text-align: center; padding: 5px; margin: 0 3px; }
.sheet-list { flex: 1 1 auto; min-height: 120px; overflow-y: auto; padding: 4px 14px; -webkit-overflow-scrolling: touch; }
.ex {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 12px; margin-bottom: 8px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  cursor: pointer;
}
.ex:active { border-color: var(--brand); }
.ex > div { min-width: 0; }
.ex .plus { font-size: 22px; color: var(--brand-2); flex: none; }
.sheet-foot { padding: 10px 14px 16px; border-top: 1px solid var(--line); }
.sheet-body { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.sheet-body textarea {
  width: 100%; min-height: 180px; resize: vertical;
  background: var(--bg-2); border: 1px solid var(--line); color: var(--dim);
  border-radius: 10px; padding: 10px 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.4;
}

.chiplist { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 0; margin: 0; }
.chip {
  display: flex; align-items: center; gap: 4px;
  background: var(--card-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 13px;
}

/* 토스트 */
.toast-root {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + 76px);
  z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none;
}
.toast {
  background: #eef1f6; color: #12151b;
  padding: 9px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
  animation: up .2s ease;
}
.toast.out { opacity: 0; transition: opacity .4s ease; }

@media (min-width: 560px) {
  .setrow { padding: 10px 12px; }
  .page { padding-left: 18px; padding-right: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>

  <div id="app"></div>
  <div id="modal" class="modal"></div>
  <div id="toast" class="toast-root"></div>

  <script>
/* 내장 운동 데이터베이스

    ['디클라인 체스트 프레스 머신', 'Decline Chest Press Machine', '가슴', '머신', '하부 대흉근', ''],
    ['펙덱 플라이 머신', 'Pec Deck Fly', '가슴', '머신', '대흉근', 'pecdeck 버터플라이'],
    ['케이블 크로스오버', 'Cable Crossover', '가슴', '케이블', '대흉근', 'crossover 크로스'],
    ['로우 케이블 플라이', 'Low Cable Fly', '가슴', '케이블', '상부 대흉근', ''],
    ['하이 케이블 플라이', 'High Cable Fly', '가슴', '케이블', '하부 대흉근', ''],
    ['스미스머신 벤치프레스', 'Smith Machine Bench Press', '가슴', '스미스', '대흉근,삼두', 'smith'],
    ['딥스 (가슴)', 'Chest Dip', '가슴', '맨몸', '하부 대흉근,삼두', 'dips 딥스'],
    ['푸시업', 'Push Up', '가슴', '맨몸', '대흉근,삼두,코어', 'pushup 팔굽혀펴기'],
    ['와이드 푸시업', 'Wide Push Up', '가슴', '맨몸', '대흉근', ''],

  // 한글 초성 추출 (초성 검색 지원: "ㅂㅊㅍ" → 벤치프레스)
  var CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function chosung(str) {
    var out = '';
    for (var i = 0; i < str.length; i++) {
      var code = str.charCodeAt(i);
      if (code >= 0xac00 && code <= 0xd7a3) out += CHO[Math.floor((code - 0xac00) / 588)];
      else if (str[i] !== ' ') out += str[i];
    }
    return out;
  }

  function slug(en) {
    return en.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

    var name = r[0], en = r[1];

    return {
      id: 'x-' + slug(en),
      name: name,
      en: en,
      part: r[2],
      equip: r[3],
      muscles: muscles,
      type: r[6] || 'reps',
      custom: false,
      _search: [name, en, r[3], r[2], muscles.join(' '), r[5] || '']
        .join(' ').toLowerCase().replace(/\s+/g, ' '),
      _cho: chosung(name)
    };
  });

  // 사용자 추가 운동을 내장 DB와 같은 형태로 보정
  function normalize(ex) {
    var muscles = Array.isArray(ex.muscles) ? ex.muscles : (ex.muscles ? String(ex.muscles).split(',') : []);
    return {
      id: ex.id,
      name: ex.name,
      en: ex.en || '',
      part: ex.part || '기타',
      equip: ex.equip || '기타',
      muscles: muscles,
      type: ex.type === 'time' ? 'time' : 'reps',
      custom: true,
      _search: [ex.name, ex.en || '', ex.equip || '', ex.part || '', muscles.join(' ')]
        .join(' ').toLowerCase().replace(/\s+/g, ' '),
      _cho: chosung(ex.name)
    };
  }

  // 검색: 이름/영문/부위/장비/근육/초성 부분 일치. 공백은 AND 조건.
  function search(list, query, filters) {
    filters = filters || {};
    var result = list;
    if (filters.part) result = result.filter(function (e) { return e.part === filters.part; });
    if (filters.equip) result = result.filter(function (e) { return e.equip === filters.equip; });

    var q = (query || '').trim().toLowerCase();
    if (!q) return result;

    var terms = q.split(/\s+/);
    var isCho = /^[ㄱ-ㅎ]+$/.test(query.replace(/\s+/g, ''));

    return result.filter(function (e) {
      return terms.every(function (t) {
        if (isCho) return e._cho.indexOf(t) !== -1;
        return e._search.indexOf(t) !== -1 || e._cho.indexOf(t) !== -1;
      });
    }).sort(function (a, b) {
      // 이름 앞부분 일치를 우선 노출
      var ai = a.name.toLowerCase().indexOf(terms[0]);
      var bi = b.name.toLowerCase().indexOf(terms[0]);
      if (ai === -1) ai = 99;
      if (bi === -1) bi = 99;
      return ai - bi;
    });
  }

  global.ExerciseDB = {
    PARTS: PARTS,
    EQUIPS: EQUIPS,
    builtIn: BUILT_IN,
    normalize: normalize,
    search: search,
    chosung: chosung
  };
})(window);

  <script>
/* localStorage 기반 저장소 */
(function (global) {
  'use strict';

  var KEY = 'gymmate.v1';
  var listeners = [];

  var DEFAULT = {
    version: 1,
    routines: [],
    sessions: [],       // 완료된 운동 기록
    customExercises: [],
    active: null,       // 진행 중인 세션
    settings: { defaultRest: 90, sound: true, unit: 'kg' }
  };

  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) {
        var seeded = seed(clone(DEFAULT));
        try { localStorage.setItem(KEY, JSON.stringify(seeded)); } catch (e) { /* 무시 */ }
        return seeded;
      }
      var parsed = JSON.parse(raw);
      return Object.assign(clone(DEFAULT), parsed, {
        settings: Object.assign(clone(DEFAULT.settings), parsed.settings || {})
      });
    } catch (e) {
      console.warn('저장된 데이터를 읽지 못해 초기화합니다.', e);
      return clone(DEFAULT);
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      alert('저장 공간이 부족해 데이터를 저장하지 못했습니다.');
    }
    listeners.forEach(function (fn) { fn(state); });
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function uid(prefix) {
    return (prefix || 'id') + '-' + Date.now().toString(36) + '-' +
      Math.random().toString(36).slice(2, 7);
  }

  // 첫 실행 시 예시 루틴 제공
  function seed(s) {
    var mk = function (exId, name, type, sets, reps, weight, rest) {
      var arr = [];

        arr.push(type === 'time' ? { sec: reps } : { reps: reps, weight: weight });
      }
      return { id: uid('it'), exerciseId: exId, name: name, type: type, restSec: rest, memo: '', sets: arr };
    };
    s.routines = [
      {
        id: uid('rt'), name: '가슴 · 삼두 (예시)', memo: '푸시 데이',
        createdAt: Date.now(), updatedAt: Date.now(),
        items: [
          mk('x-barbell-bench-press', '벤치프레스', 'reps', 5, 8, 40, 120),
          mk('x-incline-dumbbell-press', '인클라인 덤벨 프레스', 'reps', 4, 10, 16, 90),
          mk('x-pec-deck-fly', '펙덱 플라이 머신', 'reps', 3, 12, 30, 60),
          mk('x-triceps-pushdown', '케이블 푸시다운', 'reps', 3, 12, 20, 60)
        ]
      },
      {
        id: uid('rt'), name: '등 · 이두 (예시)', memo: '풀 데이',
        createdAt: Date.now(), updatedAt: Date.now(),
        items: [
          mk('x-lat-pulldown', '랫 풀다운', 'reps', 4, 10, 45, 90),
          mk('x-seated-cable-row', '시티드 케이블 로우', 'reps', 4, 10, 40, 90),
          mk('x-one-arm-dumbbell-row', '덤벨 원암 로우', 'reps', 3, 12, 20, 60),
          mk('x-dumbbell-curl', '덤벨 컬', 'reps', 3, 12, 10, 60)
        ]
      }
    ];
    return s;
  }

  var Store = {
    uid: uid,
    clone: clone,

    get state() { return state; },
    get settings() { return state.settings; },

    subscribe: function (fn) { listeners.push(fn); },
    commit: save,

    // ── 운동 목록 ──────────────────────────────────────
    allExercises: function () {
      return global.ExerciseDB.builtIn.concat(
        state.customExercises.map(global.ExerciseDB.normalize)
      );
    },
    findExercise: function (id) {
      return this.allExercises().filter(function (e) { return e.id === id; })[0] || null;
    },
    addCustomExercise: function (data) {
      var ex = {
        id: uid('cx'),
        name: data.name,
        en: data.en || '',
        part: data.part,
        equip: data.equip,
        muscles: data.muscles || [],
        type: data.type || 'reps'
      };
      state.customExercises.push(ex);
      save();
      return global.ExerciseDB.normalize(ex);
    },
    removeCustomExercise: function (id) {
      state.customExercises = state.customExercises.filter(function (e) { return e.id !== id; });
      save();
    },

    // ── 루틴 ───────────────────────────────────────────
    routines: function () { return state.routines; },
    getRoutine: function (id) {
      return state.routines.filter(function (r) { return r.id === id; })[0] || null;
    },
    createRoutine: function (name) {
      var r = {
        id: uid('rt'), name: name || '새 루틴', memo: '',
        createdAt: Date.now(), updatedAt: Date.now(), items: []
      };
      state.routines.unshift(r);
      save();
      return r;
    },
    updateRoutine: function (id, patch) {
      var r = this.getRoutine(id);
      if (!r) return null;
      Object.assign(r, patch, { updatedAt: Date.now() });
      save();
      return r;
    },
    deleteRoutine: function (id) {
      state.routines = state.routines.filter(function (r) { return r.id !== id; });
      save();
    },
    duplicateRoutine: function (id) {
      var r = this.getRoutine(id);
      if (!r) return null;
      var copy = clone(r);
      copy.id = uid('rt');
      copy.name = r.name + ' 복사본';
      copy.createdAt = copy.updatedAt = Date.now();
      copy.items.forEach(function (it) { it.id = uid('it'); });
      state.routines.unshift(copy);
      save();
      return copy;
    },

    // ── 루틴 항목 ──────────────────────────────────────
    addItem: function (routineId, exercise, opts) {
      var r = this.getRoutine(routineId);
      if (!r) return null;
      opts = opts || {};
      var sets = opts.sets || 3;
      var reps = opts.reps || 10;
      var sec = opts.sec || 60;
      var arr = [];
      for (var i = 0; i < sets; i++) {
        arr.push(exercise.type === 'time' ? { sec: sec } : { reps: reps, weight: opts.weight || 0 });
      }
      var item = {
        id: uid('it'),
        exerciseId: exercise.id,
        name: exercise.name,
        type: exercise.type,
        restSec: state.settings.defaultRest,
        memo: '',
        sets: arr
      };
      r.items.push(item);
      r.updatedAt = Date.now();
      save();
      return item;
    },
    updateItem: function (routineId, itemId, patch) {
      var r = this.getRoutine(routineId);
      if (!r) return;
      var it = r.items.filter(function (i) { return i.id === itemId; })[0];
      if (!it) return;
      Object.assign(it, patch);
      r.updatedAt = Date.now();
      save();
    },
    removeItem: function (routineId, itemId) {
      var r = this.getRoutine(routineId);
      if (!r) return;
      r.items = r.items.filter(function (i) { return i.id !== itemId; });
      r.updatedAt = Date.now();
      save();
    },
    moveItem: function (routineId, itemId, dir) {
      var r = this.getRoutine(routineId);
      if (!r) return;
      var idx = r.items.findIndex(function (i) { return i.id === itemId; });
      var next = idx + dir;
      if (idx < 0 || next < 0 || next >= r.items.length) return;
      var tmp = r.items[idx];
      r.items[idx] = r.items[next];
      r.items[next] = tmp;
      r.updatedAt = Date.now();
      save();
    },

    // ── 세션(운동 진행) ────────────────────────────────
    active: function () { return state.active; },
    startSession: function (routineId) {
      var r = this.getRoutine(routineId);
      if (!r) return null;
      state.active = {
        id: uid('ss'),
        routineId: r.id,
        routineName: r.name,
        startedAt: Date.now(),
        finishedAt: null,
        memo: '',
        items: r.items.map(function (it) {
          return {
            id: it.id,
            exerciseId: it.exerciseId,
            name: it.name,
            type: it.type,
            restSec: it.restSec,
            memo: it.memo,
            sets: it.sets.map(function (s) {
              return Object.assign({}, s, { done: false, doneAt: null });
            })
          };
        })
      };
      save();
      return state.active;
    },
    updateActive: function (mutator) {
      if (!state.active) return;
      mutator(state.active);
      save();
    },
    cancelSession: function () { state.active = null; save(); },
    finishSession: function () {
      if (!state.active) return null;
      var s = state.active;
      s.finishedAt = Date.now();
      // 체크하지 않은 세트는 기록에서 제외
      s.items.forEach(function (it) {
        it.sets = it.sets.filter(function (st) { return st.done; });
      });
      s.items = s.items.filter(function (it) { return it.sets.length > 0; });
      state.active = null;
      if (s.items.length) state.sessions.unshift(s);
      save();
      return s.items.length ? s : null;
    },

    // ── 기록 ───────────────────────────────────────────
    sessions: function () { return state.sessions; },
    getSession: function (id) {
      return state.sessions.filter(function (s) { return s.id === id; })[0] || null;
    },
    deleteSession: function (id) {
      state.sessions = state.sessions.filter(function (s) { return s.id !== id; });
      save();
    },

    // ── 백업 ───────────────────────────────────────────
    exportJSON: function () { return JSON.stringify(state, null, 2); },
    importJSON: function (text) {
      var parsed = JSON.parse(text);
      if (!parsed || !Array.isArray(parsed.routines)) throw new Error('형식이 올바르지 않습니다.');
      state = Object.assign(clone(DEFAULT), parsed, {
        settings: Object.assign(clone(DEFAULT.settings), parsed.settings || {})
      });
      save();
    },
    resetAll: function () {
      state = clone(DEFAULT);
      save();
    }
  };

  // ── 통계 헬퍼 ────────────────────────────────────────
  Store.volumeOf = function (session) {
    var v = 0;
    session.items.forEach(function (it) {
      it.sets.forEach(function (s) {
        if (s.done === false) return;
        if (it.type !== 'time') v += (Number(s.reps) || 0) * (Number(s.weight) || 0);
      });
    });
    return Math.round(v);
  };
  Store.countSets = function (session, onlyDone) {
    var total = 0, done = 0;
    session.items.forEach(function (it) {
      it.sets.forEach(function (s) { total++; if (s.done) done++; });
    });
    return onlyDone ? done : { total: total, done: done };
  };

  global.Store = Store;
})(window);

  <script>
/* 최근 운동량을 근육 부위별로 모아 인체 그림에 표시한다.
 * 세기 표현은 단일 색조 순차 램프(다크 배경 기준 검증 완료).
 */
(function (global) {
  'use strict';

  // 그림에 표시하는 근육 그룹
  var GROUPS = [
    { id: 'traps',      ko: '승모근' },
    { id: 'shoulders',  ko: '어깨' },
    { id: 'chest',      ko: '가슴' },
    { id: 'lats',       ko: '등(광배)' },
    { id: 'lowerback',  ko: '허리(기립근)' },
    { id: 'biceps',     ko: '이두' },
    { id: 'triceps',    ko: '삼두' },
    { id: 'forearms',   ko: '전완' },
    { id: 'abs',        ko: '복근' },
    { id: 'obliques',   ko: '복사근' },
    { id: 'glutes',     ko: '둔근' },
    { id: 'quads',      ko: '대퇴사두' },
    { id: 'hamstrings', ko: '햄스트링' },
    { id: 'calves',     ko: '종아리' }
  ];
  var LABEL = {};
  GROUPS.forEach(function (g) { LABEL[g.id] = g.ko; });

  // 운동 DB 의 근육 이름 → 그룹 (부분 일치, 위에서부터 검사)
  var ALIASES = [
    ['대흉근', 'chest'],
    ['광배', 'lats'], ['대원', 'lats'],
    ['능형', 'traps'], ['승모', 'traps'],
    ['삼각', 'shoulders'], ['회전근개', 'shoulders'],
    ['이두', 'biceps'],
    ['삼두', 'triceps'],
    ['전완', 'forearms'], ['상완요골', 'forearms'],
    ['복직', 'abs'], ['하복부', 'abs'], ['복횡', 'abs'], ['코어', 'abs'], ['고관절굴곡', 'abs'],
    ['복사', 'obliques'],
    ['척추기립', 'lowerback'],
    ['둔근', 'glutes'],
    ['대퇴사두', 'quads'], ['내전근', 'quads'],
    ['햄스트링', 'hamstrings'],
    ['비복', 'calves'], ['가자미', 'calves']
  ];
  var FULL_BODY = ['lats', 'shoulders', 'quads', 'glutes'];   // '전신' 표기 운동
  var BY_PART = {                                             // 근육 정보가 없을 때
    '가슴': ['chest'], '등': ['lats'], '어깨': ['shoulders'],
    '팔': ['biceps', 'triceps'], '하체': ['quads', 'hamstrings', 'glutes'],
    '코어': ['abs'], '유산소': ['quads', 'calves']
  };

  var PRIMARY = 1;      // 주동근 1세트
  var SECONDARY = 0.4;  // 보조근 0.4세트

  function groupOf(muscle) {
    for (var i = 0; i < ALIASES.length; i++) {
      if (muscle.indexOf(ALIASES[i][0]) !== -1) return ALIASES[i][1];
    }
    return null;
  }

  // 운동 하나가 어떤 그룹에 얼마만큼 기여하는지
  function contributions(item, exercise) {
    var out = {};
    var muscles = (exercise && exercise.muscles) || [];
    muscles.forEach(function (m, idx) {
      m = String(m).trim();
      if (m === '전신') {
        FULL_BODY.forEach(function (g) { out[g] = Math.max(out[g] || 0, SECONDARY); });
        return;
      }
      var g = groupOf(m);
      if (!g) return;
      var w = idx === 0 ? PRIMARY : SECONDARY;
      out[g] = Math.max(out[g] || 0, w);
    });
    if (!Object.keys(out).length) {
      var fallback = BY_PART[(exercise && exercise.part) || ''] || [];
      fallback.forEach(function (g) { out[g] = PRIMARY; });
    }
    return out;
  }

  // 기간 내 완료 기록을 그룹별로 합산
  function aggregate(sessions, days, findExercise) {
    var since = Date.now() - days * 864e5;
    var acc = {};
    GROUPS.forEach(function (g) { acc[g.id] = { sets: 0, volume: 0, top: {} }; });

    var used = 0;
    sessions.forEach(function (s) {
      if (s.startedAt < since) return;
      used++;
      s.items.forEach(function (it) {
        var ex = findExercise(it.exerciseId);
        var parts = contributions(it, ex);
        var setCount = it.sets.length;
        var vol = it.sets.reduce(function (a, st) {
          if (it.type === 'time') return a;
          return a + (Number(st.reps) || 0) * (Number(st.weight) || 0);
        }, 0);
        Object.keys(parts).forEach(function (g) {
          if (!acc[g]) return;
          var w = parts[g];
          acc[g].sets += setCount * w;
          acc[g].volume += vol * w;
          acc[g].top[it.name] = (acc[g].top[it.name] || 0) + setCount * w;
        });
      });
    });

    var max = 0;
    GROUPS.forEach(function (g) { max = Math.max(max, acc[g.id].sets); });
    return { byGroup: acc, max: max, sessions: used };
  }

  // ── 색 ─────────────────────────────────────────────────
  // 단일 색조(파랑) 순차 램프. 어두운 배경이라 값이 클수록 밝아진다.
  var RAMP = ['#2f5290', '#3a6bc4', '#4d84ea', '#7ea6ff', '#b8ceff'];
  var IDLE = '#374255';

  function colorFor(value, max) {
    if (!value || !max) return IDLE;
    var i = Math.floor((value / max) * RAMP.length - 1e-9);
    if (i < 0) i = 0;
    if (i > RAMP.length - 1) i = RAMP.length - 1;
    return RAMP[i];
  }

  // ── 인체 그림 ──────────────────────────────────────────
  // 오른쪽 절반만 정의하고 좌우 대칭으로 한 번 더 그린다.
  // 오른쪽 절반만 좌표를 정의하고 좌우 대칭으로 한 번 더 그린다.
  // viewBox 220 x 450, 중심선 x=110.
  // 비율: 머리 높이 50 → 전신 8등신, 어깨너비 = 머리너비 2.4배, 허리 < 골반 < 어깨.

  var SILHOUETTE =
    'M110,74 ' +
    'C120,74 128,79 136,86 ' +          // 승모 능선
    'C146,92 154,100 156,114 ' +        // 삼각근
    'C158,132 158,152 159,172 ' +       // 위팔 바깥
    'C160,196 162,220 163,244 ' +       // 팔꿈치 → 아래팔
    'C164,266 164,282 163,292 ' +       // 손목
    'C162,306 154,311 150,303 ' +       // 손
    'C147,296 147,286 146,276 ' +
    'C144,250 142,222 141,196 ' +       // 아래팔 안쪽
    'C140,170 139,146 138,124 ' +       // 위팔 안쪽 → 겨드랑이
    'C138,148 134,170 130,192 ' +       // 몸통 옆선 → 허리
    'C134,202 138,210 139,222 ' +       // 골반
    'C142,240 142,262 141,282 ' +       // 허벅지 바깥
    'C140,306 136,318 134,330 ' +       // 무릎
    'C133,350 131,378 127,400 ' +       // 종아리
    'C125,410 124,416 124,420 ' +       // 발목
    'C130,424 132,432 126,435 ' +       // 발
    'L112,435 ' +
    'C110,429 110,424 110,420 ' +
    'C112,396 114,360 113,330 ' +
    'C114,300 112,272 110,248 Z';

  var BASE = '<path d="' + SILHOUETTE + '"/>';

  var CENTER =
    '<ellipse cx="110" cy="44" rx="18" ry="23"/>' +      // 머리
    '<path d="M99,56 L121,56 L124,82 L96,82 Z"/>';      // 목

  // 어깨·팔은 앞뒤 위치가 같아 공유한다
  var DELT =
    'M133,88 C146,94 156,106 158,124 C157,132 152,135 148,131 ' +
    'C142,125 138,113 136,103 C135,97 132,91 133,88 Z';
  var UPPER_ARM =
    'M137,118 C143,130 149,138 153,143 C156,162 158,180 159,197 ' +
    'C155,203 145,203 142,196 C140,172 138,142 137,118 Z';
  var FOREARM =
    'M142,201 C150,197 159,202 161,221 C163,245 164,269 163,285 ' +
    'C157,293 149,291 147,281 C145,255 143,223 142,201 Z';
  var CALF =
    'M117,342 C129,340 134,356 133,378 C132,394 130,404 128,412 ' +
    'L116,412 C113,392 114,362 117,342 Z';

  // 근육 결 — 색과 무관한 형태 정보 (클릭 대상 아님)
  var LINES = {
    front:
      '<path d="M115,163 L126,164 M115,181 L125,182 M115,197 L123,198"/>' +   // 복직근 구분
      '<path d="M126,268 C131,290 133,312 133,328"/>' +        // 대퇴 직근/외측광근
      '<path d="M122,356 C126,374 127,394 126,408"/>' +        // 종아리 갈래
      '<path d="M119,117 C126,120 131,125 134,131"/>',         // 대흉근 결
    back:
      '<path d="M117,146 C126,142 133,136 138,133"/>' +        // 광배 상연
      '<path d="M119,232 C129,232 136,236 140,241"/>' +        // 둔근 결
      '<path d="M124,288 C130,306 132,324 132,336"/>' +        // 햄스트링 갈래
      '<path d="M122,356 C126,374 127,394 126,408"/>'
  };

  var FRONT = [
    ['traps',     '<path d="M113,72 C121,74 130,80 137,88 L133,99 ' +
                    'C127,90 119,85 113,83 Z"/>'],
    ['shoulders', '<path d="' + DELT + '"/>'],
    ['chest',     '<path d="M113,110 L133,116 C137,121 137,130 134,137 ' +
                    'L118,142 C114,134 113,121 113,110 Z"/>'],
    ['abs',       '<path d="M113,145 L127,148 C127,168 125,190 121,208 L113,209 Z"/>'],
    ['obliques',  '<path d="M129,147 C133,162 132,185 125,208 ' +
                    'C122,202 127,166 129,147 Z"/>'],
    ['biceps',    '<path d="' + UPPER_ARM + '"/>'],
    ['forearms',  '<path d="' + FOREARM + '"/>'],
    ['quads',     '<path d="M114,252 C129,248 141,258 141,282 ' +
                    'C141,304 138,320 135,332 L120,332 C116,312 113,284 114,252 Z"/>'],
    ['calves',    '<path d="' + CALF + '"/>']
  ];

  var BACK = [
    ['traps',      '<path d="M113,72 C123,75 133,81 140,90 ' +
                     'C136,111 125,126 113,130 Z"/>'],
    ['shoulders',  '<path d="' + DELT + '"/>'],
    ['lats',       '<path d="M114,132 C127,128 135,121 139,131 ' +
                     'C142,151 133,177 119,193 L114,196 Z"/>'],
    ['lowerback',  '<path d="M114,175 C123,173 129,181 128,194 ' +
                     'C126,207 119,214 114,216 Z"/>'],
    ['triceps',    '<path d="' + UPPER_ARM + '"/>'],
    ['forearms',   '<path d="' + FOREARM + '"/>'],
    ['glutes',     '<path d="M114,220 C129,215 142,227 141,245 ' +
                     'C140,263 127,271 114,269 Z"/>'],
    ['hamstrings', '<path d="M114,273 C129,269 141,281 141,303 ' +
                     'C141,323 138,335 135,341 L120,341 C116,321 113,297 114,273 Z"/>'],
    ['calves',     '<path d="' + CALF + '"/>']
  ];

  function figure(view, data, selected) {
    var shapes = view === 'front' ? FRONT : BACK;
    var half = shapes.map(function (s) {
      var id = s[0];
      var g = data.byGroup[id] || { sets: 0 };
      var fill = colorFor(g.sets, data.max);
      var on = selected === id ? ' bm-on' : '';
      var idle = fill === IDLE ? ' stroke="#4a5568"' : '';
      return '<g class="bm-m' + on + '" data-act="bm-sel" data-m="' + id + '" fill="' + fill + '"' + idle + '>' +
        '<title>' + LABEL[id] + ' · ' + fmtSets(g.sets) + '세트</title>' + s[1] + '</g>';
    }).join('');

    return '<svg class="bm-svg" viewBox="0 0 220 450" role="img" ' +
      'aria-label="' + (view === 'front' ? '앞모습' : '뒷모습') + ' 부위별 운동량">' +
      '<g class="bm-base">' + CENTER + BASE +
        '<g transform="translate(220,0) scale(-1,1)">' + BASE + '</g></g>' +
      '<g class="bm-muscles">' + half +
        '<g transform="translate(220,0) scale(-1,1)">' + half + '</g></g>' +
      '<g class="bm-lines">' + LINES[view] +
        '<g transform="translate(220,0) scale(-1,1)">' + LINES[view] + '</g></g>' +
      '</svg>';
  }

  function fmtSets(n) {
    if (!n) return '0';
    return (Math.round(n * 10) / 10).toString().replace(/\.0$/, '');
  }

  global.BodyMap = {
    GROUPS: GROUPS,
    LABEL: LABEL,
    RAMP: RAMP,
    IDLE: IDLE,
    PRIMARY: PRIMARY,
    SECONDARY: SECONDARY,
    aggregate: aggregate,
    colorFor: colorFor,
    figure: figure,
    fmtSets: fmtSets
  };
})(window);

  <script>
/* GymMate — 헬스 루틴 & 세트 체크 앱 */
(function () {
  'use strict';

  var S = window.Store;
  var DB = window.ExerciseDB;

  var app = document.getElementById('app');
  var modalRoot = document.getElementById('modal');
  var toastRoot = document.getElementById('toast');

  // ── 유틸 ─────────────────────────────────────────────
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? h + ':' + pad(m) : m) + ':' + pad(s);
  }
  function fmtDur(ms) {
    var m = Math.round(ms / 60000);
    if (m < 60) return m + '분';
    return Math.floor(m / 60) + '시간 ' + (m % 60) + '분';
  }
  function fmtDate(ts) {
    var d = new Date(ts);
    var days = ['일', '월', '화', '수', '목', '금', '토'];
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + days[d.getDay()] + ') ' +
      pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function toast(msg) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    toastRoot.appendChild(el);
    setTimeout(function () { el.classList.add('out'); }, 1400);
    setTimeout(function () { el.remove(); }, 1800);
  }
  function num(v, fallback) {
    var n = parseFloat(v);
    return isNaN(n) ? (fallback || 0) : n;
  }

  // ── 라우터 ───────────────────────────────────────────
  var route = { name: 'routines', param: null };
  function parseHash() {
    var h = (location.hash || '#/routines').replace(/^#\/?/, '');
    var parts = h.split('/');
    return { name: parts[0] || 'routines', param: parts[1] || null };
  }
  function go(path) { location.hash = '#/' + path; }

  window.addEventListener('hashchange', function () {
    route = parseHash();
    closeModal();
    render();
  });

  // ── 휴식 타이머 ──────────────────────────────────────
  var REST_KEY = 'gymmate.rest';
  var rest = { remain: 0, total: 0, label: '', running: false, endsAt: 0 };
  var audioCtx = null;

  // 안드로이드에서 화면을 끄거나 앱을 전환하면 타이머 간격이 느려지므로
  // 남은 시간은 종료 시각(endsAt) 기준으로 계산한다.
  function saveRest() {
    try {
      if (rest.running) {
        localStorage.setItem(REST_KEY, JSON.stringify({
          endsAt: rest.endsAt, total: rest.total, label: rest.label
        }));
      } else {
        localStorage.removeItem(REST_KEY);
      }
    } catch (e) { /* 저장 실패는 무시 */ }
  }
  function restoreRest() {
    try {
      var raw = localStorage.getItem(REST_KEY);
      if (!raw) return;
      var r = JSON.parse(raw);
      if (r && r.endsAt > Date.now() && S.active()) {
        rest.endsAt = r.endsAt; rest.total = r.total; rest.label = r.label;
        rest.remain = Math.ceil((r.endsAt - Date.now()) / 1000);
        rest.running = true;
      } else {
        localStorage.removeItem(REST_KEY);
      }
    } catch (e) { /* 무시 */ }
  }

  // 모바일 브라우저는 사용자 조작 이후에만 소리를 낼 수 있다
  function unlockAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { /* 오디오 미지원 무시 */ }
  }
  document.addEventListener('pointerdown', unlockAudio, { once: true });

  function beep() {
    if (!S.settings.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      [0, 0.18, 0.36].forEach(function (t) {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.14);
        o.start(audioCtx.currentTime + t);
        o.stop(audioCtx.currentTime + t + 0.15);
      });
    } catch (e) { /* 오디오 미지원 무시 */ }
    try {
      if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
    } catch (e) { /* 진동 미지원 무시 */ }
  }

  function startRest(sec, label) {
    if (!sec) return;
    rest.total = sec;
    rest.remain = sec;
    rest.endsAt = Date.now() + sec * 1000;
    rest.label = label || '';
    rest.running = true;
    saveRest();
    drawRest();
  }
  function stopRest() {
    rest.running = false; rest.remain = 0; rest.endsAt = 0;
    saveRest();
    drawRest();
  }
  function tickRest(silent) {
    if (!rest.running) return;
    var left = Math.ceil((rest.endsAt - Date.now()) / 1000);
    rest.remain = Math.max(0, left);
    if (left <= 0) {
      rest.running = false;
      saveRest();
      if (!silent) { beep(); toast('휴식 끝! 다음 세트 시작'); }
    }
    drawRest();
  }
  function adjustRest(delta) {
    if (!rest.running) return;
    rest.endsAt += delta * 1000;
    rest.total = Math.max(rest.total, Math.ceil((rest.endsAt - Date.now()) / 1000));
    saveRest();
    tickRest();
  }
  function drawRest() {
    var bar = document.getElementById('restbar');
    if (!bar) return;
    if (!rest.running) { bar.className = 'restbar'; bar.innerHTML = ''; return; }
    var pct = rest.total ? (rest.remain / rest.total) * 100 : 0;
    bar.className = 'restbar show';
    bar.innerHTML =
      '<div class="rest-fill" style="width:' + pct.toFixed(1) + '%"></div>' +
      '<div class="rest-inner">' +
        '<button class="rest-btn" data-act="rest-adj" data-v="-15">-15초</button>' +
        '<div class="rest-mid"><span class="rest-time">' + fmtClock(rest.remain) + '</span>' +
        '<span class="rest-label">휴식 · ' + esc(rest.label) + '</span></div>' +
        '<button class="rest-btn" data-act="rest-adj" data-v="15">+15초</button>' +
        '<button class="rest-btn ghost" data-act="rest-skip">건너뛰기</button>' +
      '</div>';
  }

  function tick() {
    tickRest();
    var el = document.querySelector('[data-tick="elapsed"]');
    var act = S.active();
    if (el && act) el.textContent = fmtClock((Date.now() - act.startedAt) / 1000);
  }
  setInterval(tick, 1000);

  // ── 화면 꺼짐 방지 (운동 중에만) ─────────────────────
  var wakeLock = null;
  function updateWakeLock() {
    if (!('wakeLock' in navigator)) return;
    var want = !!S.active();
    if (want && !wakeLock && document.visibilityState === 'visible') {
      navigator.wakeLock.request('screen').then(function (lock) {
        wakeLock = lock;
        lock.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () { /* 미지원·거부 시 무시 */ });
    } else if (!want && wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }

  // 앱으로 돌아왔을 때 타이머를 즉시 맞춘다
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    tick();
    updateWakeLock();
  });

  // ── 공통 UI 조각 ─────────────────────────────────────
  function header(title, right) {
    return '<header class="topbar"><h1>' + esc(title) + '</h1>' +
      '<div class="topbar-actions">' + (right || '') + '</div></header>';
  }
  function nav() {
    var items = [
      ['routines', '루틴', '📋'],
      ['session', '운동', '🏋️'],
      ['history', '기록', '📈'],
      ['settings', '설정', '⚙️']
    ];
    return '<nav class="tabbar">' + items.map(function (it) {
      var on = route.name === it[0] ? ' on' : '';
      return '<a class="tab' + on + '" href="#/' + it[0] + '">' +
        '<span class="tab-ico">' + it[2] + '</span><span>' + it[1] + '</span></a>';
    }).join('') + '</nav>';
  }
  function badge(text, cls) { return '<span class="badge ' + (cls || '') + '">' + esc(text) + '</span>'; }
  function empty(msg, sub) {
    return '<div class="empty"><div class="empty-ico">🗒️</div><p>' + esc(msg) + '</p>' +
      (sub ? '<p class="dim">' + esc(sub) + '</p>' : '') + '</div>';
  }

  function itemSummary(it) {
    if (!it.sets.length) return '세트 없음';
    if (it.type === 'time') {
      var secs = it.sets.map(function (s) { return s.sec; });
      var same = secs.every(function (v) { return v === secs[0]; });
      return it.sets.length + '세트 × ' + (same ? secs[0] + '초' : secs.join('/') + '초');
    }
    var reps = it.sets.map(function (s) { return s.reps; });
    var ws = it.sets.map(function (s) { return s.weight; });
    var sameR = reps.every(function (v) { return v === reps[0]; });
    var sameW = ws.every(function (v) { return v === ws[0]; });
    var w = sameW ? (ws[0] ? ws[0] + S.settings.unit : '맨몸') : '가변';
    return it.sets.length + '세트 × ' + (sameR ? reps[0] + '회' : reps.join('/') + '회') + ' · ' + w;
  }

  // ── 화면: 루틴 목록 ──────────────────────────────────
  function viewRoutines() {
    var routines = S.routines();
    var act = S.active();
    var html = header('내 루틴', '<button class="btn primary sm" data-act="new-routine">+ 새 루틴</button>');
    html += '<main class="page">';

    if (act) {
      var c = S.countSets(act);
      html += '<div class="card live" data-act="goto-session">' +
        '<div class="live-dot"></div>' +
        '<div><strong>진행 중: ' + esc(act.routineName) + '</strong>' +
        '<p class="dim">' + c.done + '/' + c.total + ' 세트 완료 · 이어서 하기</p></div>' +
        '<span class="chev">›</span></div>';
    }

    if (!routines.length) {
      html += empty('아직 루틴이 없습니다.', '“+ 새 루틴”으로 나만의 루틴을 만들어 보세요.');
    } else {
      html += '<ul class="list">' + routines.map(function (r) {
        var sets = r.items.reduce(function (a, it) { return a + it.sets.length; }, 0);
        return '<li class="card routine">' +
          '<div class="routine-head" data-act="edit-routine" data-id="' + r.id + '">' +
            '<div><h3>' + esc(r.name) + '</h3>' +
            '<p class="dim">' + r.items.length + '개 운동 · 총 ' + sets + '세트' +
            (r.memo ? ' · ' + esc(r.memo) : '') + '</p></div>' +
            '<span class="chev">›</span>' +
          '</div>' +
          '<div class="routine-preview">' +
            (r.items.slice(0, 4).map(function (it) { return badge(it.name); }).join('') || '<span class="dim">운동을 추가해 주세요</span>') +
            (r.items.length > 4 ? badge('+' + (r.items.length - 4)) : '') +
          '</div>' +
          '<div class="routine-actions">' +
            '<button class="btn primary" data-act="start-routine" data-id="' + r.id + '">운동 시작</button>' +
            '<button class="btn" data-act="edit-routine" data-id="' + r.id + '">편집</button>' +
            '<button class="btn" data-act="dup-routine" data-id="' + r.id + '">복제</button>' +
            '<button class="btn danger" data-act="del-routine" data-id="' + r.id + '">삭제</button>' +
          '</div>' +
        '</li>';
      }).join('') + '</ul>';
    }
    html += '</main>';
    return html;
  }

  // ── 화면: 루틴 편집 ──────────────────────────────────
  var openItems = {}; // 펼쳐진 항목 id

  function viewRoutineEdit(id) {
    var r = S.getRoutine(id);
    if (!r) return header('루틴', '') + '<main class="page">' + empty('루틴을 찾을 수 없습니다.') + '</main>';

    var html = header('루틴 편집',
      '<button class="btn sm" data-act="back">‹ 목록</button>');
    html += '<main class="page">';
    html += '<div class="card">' +
      '<label class="field"><span>루틴 이름</span>' +
      '<input type="text" data-bind="routine-name" data-id="' + r.id + '" value="' + esc(r.name) + '" placeholder="예: 월요일 가슴날"></label>' +
      '<label class="field"><span>메모</span>' +
      '<input type="text" data-bind="routine-memo" data-id="' + r.id + '" value="' + esc(r.memo || '') + '" placeholder="예: 상체 위주, 무게 천천히 증량"></label>' +
      '</div>';

    if (!r.items.length) {
      html += empty('운동이 비어 있습니다.', '아래 “운동 추가”로 머신 · 프리웨이트를 검색해 담아보세요.');
    } else {
      html += '<ul class="list">' + r.items.map(function (it, idx) {
        var ex = S.findExercise(it.exerciseId);
        var open = !!openItems[it.id];
        return '<li class="card item' + (open ? ' open' : '') + '">' +
          '<div class="item-head" data-act="toggle-item" data-id="' + it.id + '">' +
            '<div class="item-no">' + (idx + 1) + '</div>' +
            '<div class="item-main">' +
              '<h3>' + esc(it.name) + '</h3>' +
              '<p class="dim" data-summary="' + it.id + '">' + esc(itemSummary(it)) +
              ' · 휴식 ' + it.restSec + '초' + '</p>' +
              (ex ? '<div class="tags">' + badge(ex.part, 'part') + badge(ex.equip, 'equip') + '</div>' : '') +
            '</div>' +
            '<span class="chev">' + (open ? '⌄' : '›') + '</span>' +
          '</div>' +
          (open ? itemEditor(r, it) : '') +
        '</li>';
      }).join('') + '</ul>';
    }

    html += '<div class="stack">' +
      '<button class="btn block" data-act="open-picker" data-id="' + r.id + '">+ 운동 추가</button>' +
      '<button class="btn primary block" data-act="start-routine" data-id="' + r.id + '">이 루틴으로 운동 시작</button>' +
      '</div>';
    html += '</main>';
    return html;
  }

  function itemEditor(r, it) {
    var unit = S.settings.unit;
    var rows = it.sets.map(function (st, i) {
      var fields = it.type === 'time'
        ? '<label class="mini"><input type="number" inputmode="numeric" min="0" step="5" value="' + num(st.sec, 0) + '" ' +
            'data-bind="set-sec" data-rid="' + r.id + '" data-iid="' + it.id + '" data-si="' + i + '"><span>초</span></label>'
        : '<label class="mini"><input type="number" inputmode="decimal" min="0" step="0.5" value="' + num(st.weight, 0) + '" ' +
            'data-bind="set-weight" data-rid="' + r.id + '" data-iid="' + it.id + '" data-si="' + i + '"><span>' + unit + '</span></label>' +
          '<span class="x">×</span>' +
          '<label class="mini"><input type="number" inputmode="numeric" min="0" step="1" value="' + num(st.reps, 0) + '" ' +
            'data-bind="set-reps" data-rid="' + r.id + '" data-iid="' + it.id + '" data-si="' + i + '"><span>회</span></label>';
      return '<div class="setrow">' +
        '<span class="setno">' + (i + 1) + '세트</span>' + fields +
        '<button class="icon danger" title="세트 삭제" data-act="del-set" data-rid="' + r.id + '" data-iid="' + it.id + '" data-si="' + i + '">✕</button>' +
        '</div>';
    }).join('');

    return '<div class="item-body">' +
      '<div class="setlist">' + rows + '</div>' +
      '<div class="row gap">' +
        '<button class="btn sm" data-act="add-set" data-rid="' + r.id + '" data-iid="' + it.id + '">+ 세트 추가</button>' +
        '<button class="btn sm" data-act="fill-sets" data-rid="' + r.id + '" data-iid="' + it.id + '">1세트 값으로 전체 채우기</button>' +
      '</div>' +
      '<div class="row gap wrap">' +
        '<label class="field inline"><span>휴식(초)</span>' +
          '<input type="number" inputmode="numeric" min="0" step="10" value="' + it.restSec + '" data-bind="item-rest" data-rid="' + r.id + '" data-iid="' + it.id + '"></label>' +
        '<label class="field inline grow"><span>운동 메모</span>' +
          '<input type="text" value="' + esc(it.memo || '') + '" placeholder="예: 3번 핀, 등받이 4칸" data-bind="item-memo" data-rid="' + r.id + '" data-iid="' + it.id + '"></label>' +
      '</div>' +
      '<div class="row gap">' +
        '<button class="btn sm" data-act="move-item" data-rid="' + r.id + '" data-iid="' + it.id + '" data-dir="-1">↑ 위로</button>' +
        '<button class="btn sm" data-act="move-item" data-rid="' + r.id + '" data-iid="' + it.id + '" data-dir="1">↓ 아래로</button>' +
        '<button class="btn sm danger" data-act="del-item" data-rid="' + r.id + '" data-iid="' + it.id + '">운동 삭제</button>' +
      '</div>' +
    '</div>';
  }

  // 입력 중 전체 재렌더는 포커스를 잃게 하므로 요약 줄만 갱신한다
  function refreshItemSummary(rid, iid) {
    var r = S.getRoutine(rid);
    if (!r) return;
    var it = r.items.filter(function (i) { return i.id === iid; })[0];
    if (!it) return;
    var el = document.querySelector('[data-summary="' + iid + '"]');
    if (el) el.textContent = itemSummary(it) + ' · 휴식 ' + it.restSec + '초';
  }

  // ── 화면: 운동 진행 ──────────────────────────────────
  function viewSession() {
    var s = S.active();
    if (!s) {
      var routines = S.routines();
      return header('운동') + '<main class="page">' +
        empty('진행 중인 운동이 없습니다.', '루틴을 골라 시작해 보세요.') +
        (routines.length ? '<ul class="list">' + routines.map(function (r) {
          return '<li class="card row between">' +
            '<div><strong>' + esc(r.name) + '</strong><p class="dim">' + r.items.length + '개 운동</p></div>' +
            '<button class="btn primary" data-act="start-routine" data-id="' + r.id + '">시작</button></li>';
        }).join('') + '</ul>' : '') +
        '</main>';
    }

    var c = S.countSets(s);
    var pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
    var html = header(s.routineName,
      '<button class="btn sm" data-act="cancel-session">중단</button>' +
      '<button class="btn primary sm" data-act="finish-session">운동 완료</button>');

    html += '<main class="page session">';
    html += '<div class="card progress-card">' +
      '<div class="row between"><span class="dim">경과</span><strong data-tick="elapsed">' + fmtClock((Date.now() - s.startedAt) / 1000) + '</strong></div>' +
      '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="row between"><span class="dim">' + c.done + ' / ' + c.total + ' 세트</span>' +
      '<span class="dim">총 볼륨 ' + S.volumeOf(s).toLocaleString() + S.settings.unit + '</span></div>' +
      '</div>';

    html += s.items.map(function (it, idx) {
      var doneCount = it.sets.filter(function (x) { return x.done; }).length;
      var allDone = doneCount === it.sets.length && it.sets.length > 0;
      return '<section class="card exercise' + (allDone ? ' done' : '') + '">' +
        '<div class="row between">' +
          '<h3>' + (idx + 1) + '. ' + esc(it.name) + (allDone ? ' ✅' : '') + '</h3>' +
          '<span class="dim">' + doneCount + '/' + it.sets.length + '</span>' +
        '</div>' +
        (it.memo ? '<p class="dim memo">📝 ' + esc(it.memo) + '</p>' : '') +
        '<div class="setlist">' + it.sets.map(function (st, i) {
          var fields = it.type === 'time'
            ? '<label class="mini"><input type="number" inputmode="numeric" min="0" step="5" value="' + num(st.sec, 0) + '" ' +
                'data-bind="live-sec" data-iid="' + it.id + '" data-si="' + i + '"><span>초</span></label>'
            : '<label class="mini"><input type="number" inputmode="decimal" min="0" step="0.5" value="' + num(st.weight, 0) + '" ' +
                'data-bind="live-weight" data-iid="' + it.id + '" data-si="' + i + '"><span>' + S.settings.unit + '</span></label>' +
              '<span class="x">×</span>' +
              '<label class="mini"><input type="number" inputmode="numeric" min="0" step="1" value="' + num(st.reps, 0) + '" ' +
                'data-bind="live-reps" data-iid="' + it.id + '" data-si="' + i + '"><span>회</span></label>';
          return '<div class="setrow live' + (st.done ? ' checked' : '') + '">' +
            '<span class="setno">' + (i + 1) + '</span>' + fields +
            '<button class="check' + (st.done ? ' on' : '') + '" data-act="toggle-set" data-iid="' + it.id + '" data-si="' + i + '" ' +
              'aria-pressed="' + (st.done ? 'true' : 'false') + '" title="세트 완료 체크">' + (st.done ? '✓' : '') + '</button>' +
            '</div>';
        }).join('') + '</div>' +
        '<div class="row gap">' +
          '<button class="btn sm" data-act="live-add-set" data-iid="' + it.id + '">+ 세트</button>' +
          '<button class="btn sm" data-act="live-del-set" data-iid="' + it.id + '">− 세트</button>' +
          '<label class="mini restedit right"><span>휴식</span>' +
            '<input type="number" inputmode="numeric" min="0" step="10" value="' + it.restSec + '" ' +
            'data-bind="live-rest" data-iid="' + it.id + '" aria-label="휴식 시간(초)"><span>초</span></label>' +
        '</div>' +
      '</section>';
    }).join('');

    html += '<button class="btn primary block lg" data-act="finish-session">운동 완료하고 기록 저장</button>';
    html += '</main>';
    return html;
  }

  // ── 화면: 기록 ───────────────────────────────────────
  var bmSel = null;   // 근육 지도에서 선택한 부위

  function bodyMapCard(sessions) {
    var BM = window.BodyMap;
    if (!BM) return '';
    var data = BM.aggregate(sessions, 7, function (id) { return S.findExercise(id); });
    var ranked = BM.GROUPS.map(function (g) {
      return { id: g.id, ko: g.ko, sets: data.byGroup[g.id].sets, volume: data.byGroup[g.id].volume };
    }).sort(function (a, b) { return b.sets - a.sets; });

    var trained = ranked.filter(function (r) { return r.sets > 0; });
    var sel = bmSel && data.byGroup[bmSel] ? bmSel : (trained[0] ? trained[0].id : null);

    var legend = '<div class="bm-legend">' +
      '<span class="dim">적음</span>' +
      BM.RAMP.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join('') +
      '<span class="dim">많음</span>' +
      '<span class="bm-idle"><i style="background:' + BM.IDLE + '"></i>미실시</span>' +
      '</div>';

    var detail = '';
    if (sel) {
      var d = data.byGroup[sel];
      var tops = Object.keys(d.top).sort(function (a, b) { return d.top[b] - d.top[a]; }).slice(0, 3);
      detail = '<div class="bm-detail">' +
        '<div class="row between"><strong>' + esc(BM.LABEL[sel]) + '</strong>' +
        '<span class="dim">' + BM.fmtSets(d.sets) + '세트' +
        (d.volume ? ' · ' + Math.round(d.volume).toLocaleString() + S.settings.unit : '') + '</span></div>' +
        (tops.length
          ? '<p class="dim">' + tops.map(function (n) {
              return esc(n) + ' ' + BM.fmtSets(d.top[n]);
            }).join(' · ') + '</p>'
          : '<p class="dim">최근 7일 동안 이 부위 기록이 없습니다.</p>') +
        '</div>';
    }

    var rank = trained.length
      ? '<ul class="bm-rank">' + trained.map(function (r) {
          var pct = data.max ? Math.max(4, (r.sets / data.max) * 100) : 0;
          var on = r.id === sel ? ' on' : '';
          return '<li class="bm-row' + on + '" data-act="bm-sel" data-m="' + r.id + '">' +
            '<span class="bm-name">' + esc(r.ko) + '</span>' +
            '<span class="bm-bar"><i style="width:' + pct.toFixed(1) + '%;background:' +
              BM.colorFor(r.sets, data.max) + '"></i></span>' +
            '<span class="bm-val">' + BM.fmtSets(r.sets) + '</span></li>';
        }).join('') + '</ul>'
      : '<p class="dim center">최근 7일 기록이 없습니다.</p>';

    return '<section class="card bodymap">' +
      '<div class="row between"><h3>최근 7일 부위별 운동량</h3>' +
      '<span class="dim">' + data.sessions + '회 운동</span></div>' +
      '<p class="dim">주동근 1세트, 보조근 0.4세트로 계산합니다. 부위를 눌러 자세히 보세요.</p>' +
      '<div class="bm-figs">' +
        '<figure class="bm-fig">' + BM.figure('front', data, sel) + '<figcaption>앞</figcaption></figure>' +
        '<figure class="bm-fig">' + BM.figure('back', data, sel) + '<figcaption>뒤</figcaption></figure>' +
      '</div>' +
      legend + detail + rank +
      '</section>';
  }

  function viewHistory(id) {
    if (id) return viewHistoryDetail(id);
    var list = S.sessions();
    var html = header('운동 기록');
    html += '<main class="page">';

    if (!list.length) {
      html += empty('기록이 없습니다.', '운동을 완료하면 여기에 쌓입니다.');
    } else {
      var weekAgo = Date.now() - 7 * 864e5;
      var week = list.filter(function (s) { return s.startedAt >= weekAgo; });
      var weekVol = week.reduce(function (a, s) { return a + S.volumeOf(s); }, 0);
      html += '<div class="card stats">' +
        '<div><strong>' + week.length + '</strong><span class="dim">최근 7일 운동</span></div>' +
        '<div><strong>' + weekVol.toLocaleString() + '</strong><span class="dim">7일 볼륨(' + S.settings.unit + ')</span></div>' +
        '<div><strong>' + list.length + '</strong><span class="dim">총 운동 횟수</span></div>' +
        '</div>';

      html += bodyMapCard(list);

      html += '<ul class="list">' + list.map(function (s) {
        return '<li class="card row between" data-act="open-history" data-id="' + s.id + '">' +
          '<div><strong>' + esc(s.routineName) + '</strong>' +
          '<p class="dim">' + fmtDate(s.startedAt) + ' · ' + fmtDur(s.finishedAt - s.startedAt) +
          ' · ' + S.countSets(s, true) + '세트 · ' + S.volumeOf(s).toLocaleString() + S.settings.unit + '</p></div>' +
          '<span class="chev">›</span></li>';
      }).join('') + '</ul>';
    }
    html += '</main>';
    return html;

      '<h3>' + esc(s.routineName) + '</h3>' +

  // ── 운동 검색 모달 ───────────────────────────────────
  var picker = { routineId: null, q: '', part: '', equip: '', sets: 3, reps: 10 };

  function openPicker(routineId) {
    picker.routineId = routineId;
    picker.q = ''; picker.part = ''; picker.equip = '';
    drawPicker();
    setTimeout(function () {
      var i = document.getElementById('pk-q');
      if (i) i.focus();
    }, 30);
  }
  function closeModal() { modalRoot.innerHTML = ''; modalRoot.classList.remove('show'); }

  function pickerResults() {
    var list = DB.search(S.allExercises(), picker.q, { part: picker.part, equip: picker.equip });
    if (!list.length) return '<div class="empty small"><p>검색 결과가 없습니다.</p></div>';
    return list.map(function (e) {
      return '<div class="ex" data-act="pk-add" data-id="' + e.id + '">' +
        '<div><strong>' + esc(e.name) + '</strong>' +
        '<p class="dim">' + esc(e.en || '') + (e.muscles.length ? ' · ' + esc(e.muscles.join(', ')) : '') + '</p>' +
        '<div class="tags">' + badge(e.part, 'part') + badge(e.equip, 'equip') +
        (e.type === 'time' ? badge('시간') : '') + (e.custom ? badge('내 운동', 'mine') : '') + '</div></div>' +
        '<span class="plus">+</span></div>';
    }).join('');
  }

  // 검색어를 칠 때 시트 전체를 다시 그리면 입력창이 새 요소로 교체돼
  // 한글 조합(IME)이 매 글자마다 끊긴다. 그래서 결과 목록만 갈아끼운다.
  function updatePicker() {
    var sheet = modalRoot.querySelector('.sheet');
    if (!sheet) return;
    var chips = sheet.querySelectorAll('.fchip');
    for (var i = 0; i < chips.length; i++) {
      var c = chips[i];
      c.classList.toggle('on', picker[c.dataset.key] === c.dataset.v);
    }
    var listEl = sheet.querySelector('.sheet-list');
    if (listEl) {
      listEl.innerHTML = pickerResults();
      listEl.scrollTop = 0;
    }
    var customBtn = sheet.querySelector('[data-act="pk-custom"]');
    if (customBtn) {
      customBtn.innerHTML = '＋ 직접 추가하기' + (picker.q ? ' (“' + esc(picker.q) + '”)' : '');
    }
  }

  function drawPicker() {
    var chips = function (label, key, values) {
      return '<div class="chiprow"><span class="chiprow-label">' + label + '</span>' +
        '<button class="fchip' + (picker[key] === '' ? ' on' : '') + '" data-act="pk-filter" data-key="' + key + '" data-v="">전체</button>' +
        values.map(function (v) {
          return '<button class="fchip' + (picker[key] === v ? ' on' : '') + '" data-act="pk-filter" data-key="' + key + '" data-v="' + v + '">' + v + '</button>';
        }).join('') + '</div>';
    };

    modalRoot.classList.add('show');
    modalRoot.innerHTML =
      '<div class="sheet-bg" data-act="close-modal"></div>' +
      '<div class="sheet">' +
        '<div class="sheet-head">' +
          '<h2>운동 검색</h2>' +
          '<button class="icon" data-act="close-modal">✕</button>' +
        '</div>' +
        '<div class="sheet-search">' +
          '<input id="pk-q" type="search" placeholder="예: 랫풀다운, 머신, 하체, ㅂㅊㅍ" value="' + esc(picker.q) + '" data-bind="pk-q" autocomplete="off">' +
        '</div>' +
        chips('부위', 'part', DB.PARTS) +
        chips('장비', 'equip', DB.EQUIPS) +
        '<div class="sheet-default">' +
          '기본값 <input type="number" inputmode="numeric" min="1" max="20" value="' + picker.sets + '" data-bind="pk-sets">세트 × ' +
          '<input type="number" inputmode="numeric" min="1" max="100" value="' + picker.reps + '" data-bind="pk-reps">회로 추가' +
        '</div>' +
        '<div class="sheet-list">' + pickerResults() + '</div>' +
        '<div class="sheet-foot">' +
          '<button class="btn block" data-act="pk-custom">＋ 직접 추가하기' + (picker.q ? ' (“' + esc(picker.q) + '”)' : '') + '</button>' +
        '</div>' +
      '</div>';
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function openExportSheet() {
    modalRoot.classList.add('show');
    modalRoot.innerHTML =
      '<div class="sheet-bg" data-act="close-modal"></div>' +
      '<div class="sheet">' +
        '<div class="sheet-head"><h2>데이터 백업</h2>' +
        '<button class="icon" data-act="close-modal">✕</button></div>' +
        '<div class="sheet-body">' +
          '<p class="dim">아래 내용을 메모장·메일 등에 복사해 두면 나중에 그대로 되돌릴 수 있습니다.</p>' +
          '<textarea id="exp-json" readonly spellcheck="false">' + esc(S.exportJSON()) + '</textarea>' +
        '</div>' +
        '<div class="sheet-foot stack">' +
          '<button class="btn primary block" data-act="export-copy">복사하기</button>' +
          '<button class="btn block" data-act="export-file">파일로 저장</button>' +
        '</div>' +
