<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="헬스 머신·프리웨이트를 검색해 나만의 루틴을 만들고, 세트를 완료할 때마다 체크하는 운동 보조 앱">
<title>GymMate · 헬스 루틴 &amp; 세트 체크</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymMate">
<style>
/* GymMate — 모바일 우선 다크 테마 */
:root {
  --bg: #0f1115;
  --bg-2: #161a21;
  --card: #1b2029;
  --card-2: #222836;
  --line: #2c3240;
  --text: #eef1f6;
  --dim: #93a0b4;
  --brand: #4d7cff;
  --brand-2: #6c93ff;
  --ok: #35c98a;
  --danger: #ff5f6d;
  --radius: 14px;
  --tab-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
    "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }
h1 { font-size: 19px; }
h3 { font-size: 16px; }
p { margin: 2px 0 0; }
a { color: inherit; text-decoration: none; }
.dim { color: var(--dim); font-size: 13px; }
.center { text-align: center; }
.right { margin-left: auto; }

/* 레이아웃 */
#app { max-width: 640px; margin: 0 auto; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px;
  background: rgba(15, 17, 21, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-actions { display: flex; gap: 6px; flex: none; }
.page {
  padding: 14px 14px calc(var(--tab-h) + 96px + var(--safe-b));
  display: flex; flex-direction: column; gap: 12px;
}

/* 카드 */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; }
.row.between { justify-content: space-between; }
.row.gap { gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.chev { color: var(--dim); font-size: 22px; flex: none; }

/* 버튼 */
.btn {
  appearance: none;
  background: var(--card-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: transform .06s ease, background .15s ease;
}
.btn:active { transform: scale(.97); }
.btn.sm { padding: 7px 10px; font-size: 13px; }
.btn.lg { padding: 16px; font-size: 16px; }
.btn.block { width: 100%; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:active { background: var(--brand-2); }
.btn.danger { color: var(--danger); border-color: #43303a; }
.btn.ghost { background: transparent; }
.icon {
  background: transparent; border: 0; color: var(--dim);
  font-size: 16px; cursor: pointer; padding: 6px; border-radius: 8px;
}
.icon.danger { color: var(--danger); }

/* 배지 */
.badge {
  display: inline-block;
  background: var(--card-2);
  border: 1px solid var(--line);
  color: var(--dim);
  border-radius: 999px;
  padding: 3px 9px;
  font-size: 12px;
  margin: 0 6px 6px 0;
}
.badge.part { color: #9fc0ff; border-color: #2d3a5c; }
.badge.equip { color: #ffd28a; border-color: #4a3c22; }
.badge.mine { color: var(--ok); border-color: #24483a; }
.tags { margin-top: 6px; }
.tags .badge { margin-bottom: 0; }

/* 루틴 카드 */
.routine-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; gap: 8px; }
.routine-preview { margin-top: 10px; }
.routine-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.routine-actions .btn { flex: 1; min-width: 0; padding: 10px 6px; font-size: 13px; white-space: nowrap; }
.routine-actions .btn.primary { flex: 1.35; }

.card.live {
  display: flex; align-items: center; gap: 12px;
  border-color: var(--brand); background: linear-gradient(180deg, #1c2740, var(--card));
  cursor: pointer;
}
.live-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none;
  box-shadow: 0 0 0 0 rgba(53, 201, 138, .6);
  animation: pulse 1.8s infinite;
}
.card.live > div:nth-child(2) { flex: 1; }
@keyframes pulse {
  70% { box-shadow: 0 0 0 12px rgba(53, 201, 138, 0); }
  100% { box-shadow: 0 0 0 0 rgba(53, 201, 138, 0); }
}

/* 폼 */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.field:last-child { margin-bottom: 0; }
.field > span { font-size: 12px; color: var(--dim); }
.field.inline { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.field.inline > span { flex: none; }
.field.inline.grow { flex: 1; }
input[type=text], input[type=number], input[type=search], select {
  background: var(--bg-2);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 15px;
  font-family: inherit;
  width: 100%;
  min-width: 0;
}
.field.inline input[type=number], .field.inline select { width: 110px; text-align: right; }
input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--brand); }
input[type=range] { width: 100%; accent-color: var(--brand); }
.field select { width: 100%; }
.field.inline select { width: 110px; }

/* 루틴 항목 */
.item-head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.item-no {
  width: 26px; height: 26px; flex: none;
  display: grid; place-items: center;
  background: var(--card-2); border-radius: 8px;
  font-size: 13px; color: var(--dim); font-weight: 700;
}
.item-main { flex: 1; min-width: 0; }
.item-main h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-body { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }

/* 세트 행 */
.setlist { display: flex; flex-direction: column; gap: 8px; }
.setrow {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.setrow.static { justify-content: space-between; }
.setno { font-size: 12px; color: var(--dim); flex: none; min-width: 34px; font-weight: 700; }
.mini { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
.mini input { text-align: right; padding: 8px 8px; }
.mini > span { font-size: 12px; color: var(--dim); flex: none; }
.x { color: var(--dim); flex: none; }
.mini.restedit { flex: 0 0 auto; gap: 4px; }
.mini.restedit input { width: 68px; text-align: center; padding: 7px 6px; }

/* 운동 진행 */
.progress-card { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 58px; z-index: 10; }
.bar { height: 8px; background: var(--bg-2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--brand), var(--ok)); transition: width .25s ease; }
.exercise { display: flex; flex-direction: column; gap: 10px; }
.exercise.done { border-color: #24483a; }
.exercise .memo { font-style: italic; }
.setrow.live.checked { background: rgba(53, 201, 138, .10); border-color: #2b6a52; }
.setrow.live.checked input { color: var(--dim); }
.check {
  flex: none;
  width: 44px; height: 44px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--card-2);
  color: #fff; font-size: 20px; font-weight: 800;
  cursor: pointer;
  display: grid; place-items: center;
  transition: transform .08s ease, background .15s ease;
}
.check:active { transform: scale(.9); }
.check.on { background: var(--ok); border-color: var(--ok); color: #06301f; }

/* 기록 통계 */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 8px; text-align: center; }
.stats > div { display: flex; flex-direction: column; gap: 2px; }
.stats strong { font-size: 21px; font-variant-numeric: tabular-nums; }
@media (min-width: 460px) { .stats { grid-template-columns: repeat(4, 1fr); } }

/* 안내 목소리 목록 */
.voicelist { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.voicerow {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 6px 8px 6px 12px;
}
.voicerow.on { border-color: var(--brand); background: rgba(77, 124, 255, .12); }
.voicepick {
  flex: 1; min-width: 0; text-align: left; background: none; border: 0; color: var(--text);
  font-family: inherit; cursor: pointer; padding: 10px 0;
}
.voicepick strong { font-size: 16px; }

/* 근육 지도 */
.bodymap { display: flex; flex-direction: column; gap: 10px; }
.bm-figs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bm-fig { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bm-fig figcaption { font-size: 11px; color: var(--dim); letter-spacing: .08em; }
.bm-svg { width: 100%; height: 300px; display: block; }
.bm-skin { fill: #2b3341; }
.bm-skin path { fill: #2b3341; }
.bm-m { cursor: pointer; stroke: #141821; stroke-width: 0.16; stroke-linejoin: round; }
.bm-m.bm-idle { stroke: #4c5a72; }
.bm-m:hover { opacity: .85; }
.bm-m.bm-on { stroke: var(--text); stroke-width: 0.5; }

.bm-legend { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 12px; }
.bm-legend i { width: 20px; height: 10px; border-radius: 2px; display: inline-block; }
.bm-legend .bm-idle { display: flex; align-items: center; gap: 4px; margin-left: auto; color: var(--dim); }

.bm-detail {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px;
}
.bm-rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.bm-row {
  display: grid; grid-template-columns: 74px 1fr 34px;
  align-items: center; gap: 8px; cursor: pointer;
  padding: 3px 4px; border-radius: 8px;
}
.bm-row.on { background: var(--bg-2); }
.bm-name { font-size: 13px; color: var(--dim); }
.bm-row.on .bm-name { color: var(--text); }
.bm-bar { height: 10px; background: var(--bg-2); border-radius: 5px; overflow: hidden; }
.bm-bar i { display: block; height: 100%; border-radius: 5px; }
.bm-val { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }

/* 빈 상태 */
.empty { text-align: center; padding: 40px 16px; color: var(--dim); }
.empty.small { padding: 24px; }
.empty-ico { font-size: 34px; margin-bottom: 8px; }

/* 하단 탭 */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--tab-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  display: flex;
  background: rgba(22, 26, 33, .96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 11px; color: var(--dim); font-weight: 600;
}
.tab.on { color: var(--brand-2); }
.tab-ico { font-size: 19px; line-height: 1; }

/* 휴식 타이머 바 */
.restbar {
  position: fixed; left: 0; right: 0; z-index: 25;
  bottom: calc(var(--tab-h) + var(--safe-b));
  max-width: 640px; margin: 0 auto;
  overflow: hidden;
  transform: translateY(110%);
  transition: transform .25s ease;
  background: var(--card-2);
  border-top: 1px solid var(--brand);
}
.restbar.show { transform: translateY(0); }
.rest-fill {
  position: absolute; inset: 0 auto 0 0;
  background: rgba(77, 124, 255, .18);
  transition: width 1s linear;
}
.rest-inner { position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.rest-mid { flex: 1; display: flex; flex-direction: column; align-items: center; }
.rest-time { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.rest-label { font-size: 11px; color: var(--dim); }
.rest-btn {
  background: var(--card); border: 1px solid var(--line); color: var(--text);
  border-radius: 9px; padding: 8px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: inherit; flex: none;
}
.rest-btn.ghost { color: var(--dim); }

/* 운동 검색 시트 */
.modal { position: fixed; inset: 0; z-index: 50; display: none; }
.modal.show { display: block; }
.sheet-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-width: 640px; margin: 0 auto;
  max-height: 92vh;
  display: flex; flex-direction: column;
  background: var(--bg);
  border-radius: 18px 18px 0 0;
  border: 1px solid var(--line);
  padding-bottom: var(--safe-b);
  animation: up .22s ease;
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
.sheet > * { flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.sheet-search { padding: 0 14px 10px; }
.chiprow { display: flex; align-items: center; gap: 6px; padding: 0 14px 8px; overflow-x: auto; scrollbar-width: none; }
.chiprow::-webkit-scrollbar { display: none; }
.chiprow-label { font-size: 11px; color: var(--dim); flex: none; width: 30px; }
.fchip {
  flex: none; background: var(--card); border: 1px solid var(--line); color: var(--dim);
  border-radius: 999px; padding: 6px 11px; font-size: 13px; cursor: pointer; font-family: inherit;
}
.fchip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.sheet-default { padding: 6px 14px 10px; font-size: 13px; color: var(--dim); }
.sheet-default input { width: 56px; display: inline-block; text-align: center; padding: 5px; margin: 0 3px; }
.sheet-list { flex: 1 1 auto; min-height: 120px; overflow-y: auto; padding: 4px 14px; -webkit-overflow-scrolling: touch; }
.ex {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 12px; margin-bottom: 8px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  cursor: pointer;
}
.ex:active { border-color: var(--brand); }
.ex > div { min-width: 0; }
.ex .plus { font-size: 22px; color: var(--brand-2); flex: none; }
.sheet-foot { padding: 10px 14px 16px; border-top: 1px solid var(--line); }
.sheet-body { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.sheet-body textarea {
  width: 100%; min-height: 180px; resize: vertical;
  background: var(--bg-2); border: 1px solid var(--line); color: var(--dim);
  border-radius: 10px; padding: 10px 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.4;
}

.chiplist { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 0; margin: 0; }
.chip {
  display: flex; align-items: center; gap: 4px;
  background: var(--card-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 13px;
}

/* 토스트 */
.toast-root {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + 76px);
  z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none;
}
.toast {
  background: #eef1f6; color: #12151b;
  padding: 9px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
  animation: up .2s ease;
}
.toast.out { opacity: 0; transition: opacity .4s ease; }

@media (min-width: 560px) {
  .setrow { padding: 10px 12px; }
  .page { padding-left: 18px; padding-right: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
  <div id="app"></div>
  <div id="modal" class="modal"></div>
  <div id="toast" class="toast-root"></div>

  <script>
/* 내장 운동 데이터베이스
 * 형식: [이름, 영문명, 부위, 장비, 주동근(쉼표), 검색태그, 타입]
 * 타입: 'reps'(기본, 횟수) | 'time'(시간)
 */

    ['인클라인 덤벨 프레스', 'Incline Dumbbell Press', '가슴', '덤벨', '상부 대흉근', 'incline db 인덤프'],
    ['디클라인 덤벨 프레스', 'Decline Dumbbell Press', '가슴', '덤벨', '하부 대흉근', ''],
    ['덤벨 플라이', 'Dumbbell Fly', '가슴', '덤벨', '대흉근', 'fly 플라이'],

    ['체스트 프레스 머신', 'Chest Press Machine', '가슴', '머신', '대흉근,삼두', 'chestpress 체프'],
    ['인클라인 체스트 프레스 머신', 'Incline Chest Press Machine', '가슴', '머신', '상부 대흉근', ''],
    ['디클라인 체스트 프레스 머신', 'Decline Chest Press Machine', '가슴', '머신', '하부 대흉근', ''],
    ['펙덱 플라이 머신', 'Pec Deck Fly', '가슴', '머신', '대흉근', 'pecdeck 버터플라이'],
    ['케이블 크로스오버', 'Cable Crossover', '가슴', '케이블', '대흉근', 'crossover 크로스'],

  // 한글 초성 추출 (초성 검색 지원: "ㅂㅊㅍ" → 벤치프레스)
  var CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function chosung(str) {
    var out = '';
    for (var i = 0; i < str.length; i++) {
      var code = str.charCodeAt(i);
      if (code >= 0xac00 && code <= 0xd7a3) out += CHO[Math.floor((code - 0xac00) / 588)];
      else if (str[i] !== ' ') out += str[i];
    }
    return out;
  }

  function slug(en) {
    return en.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  var BUILT_IN = RAW.map(function (r) {
    var name = r[0], en = r[1];
    var muscles = r[4] ? r[4].split(',') : [];
    return {
      id: 'x-' + slug(en),
      name: name,
      en: en,
      part: r[2],
      equip: r[3],
      muscles: muscles,
      type: r[6] || 'reps',
      custom: false,
      _search: [name, en, r[3], r[2], muscles.join(' '), r[5] || '']
        .join(' ').toLowerCase().replace(/\s+/g, ' '),
      _cho: chosung(name)
    };
  });

  // 사용자 추가 운동을 내장 DB와 같은 형태로 보정
  function normalize(ex) {
    var muscles = Array.isArray(ex.muscles) ? ex.muscles : (ex.muscles ? String(ex.muscles).split(',') : []);
    return {
      id: ex.id,
      name: ex.name,
      en: ex.en || '',
      part: ex.part || '기타',
      equip: ex.equip || '기타',
      muscles: muscles,
      type: ex.type === 'time' ? 'time' : 'reps',
      custom: true,
      _search: [ex.name, ex.en || '', ex.equip || '', ex.part || '', muscles.join(' ')]
        .join(' ').toLowerCase().replace(/\s+/g, ' '),
      _cho: chosung(ex.name)
    };
  }

  // 검색: 이름/영문/부위/장비/근육/초성 부분 일치. 공백은 AND 조건.
  function search(list, query, filters) {
    filters = filters || {};
    var result = list;
    if (filters.part) result = result.filter(function (e) { return e.part === filters.part; });
    if (filters.equip) result = result.filter(function (e) { return e.equip === filters.equip; });

    var q = (query || '').trim().toLowerCase();
    if (!q) return result;

    var terms = q.split(/\s+/);
    var isCho = /^[ㄱ-ㅎ]+$/.test(query.replace(/\s+/g, ''));

    return result.filter(function (e) {
      return terms.every(function (t) {
        if (isCho) return e._cho.indexOf(t) !== -1;
        return e._search.indexOf(t) !== -1 || e._cho.indexOf(t) !== -1;
      });
    }).sort(function (a, b) {
      // 이름 앞부분 일치를 우선 노출
      var ai = a.name.toLowerCase().indexOf(terms[0]);
      var bi = b.name.toLowerCase().indexOf(terms[0]);
      if (ai === -1) ai = 99;
      if (bi === -1) bi = 99;
      return ai - bi;
    });
  }

  global.ExerciseDB = {
    PARTS: PARTS,
    EQUIPS: EQUIPS,
    builtIn: BUILT_IN,
    normalize: normalize,
    search: search,
    chosung: chosung
  };

  <script>
/* localStorage 기반 저장소 */
(function (global) {
  'use strict';

  var KEY = 'gymmate.v1';
  var listeners = [];

  var DEFAULT = {
    version: 1,
    routines: [],
    sessions: [],       // 완료된 운동 기록
    customExercises: [],
    active: null,       // 진행 중인 세션
    settings: {
      defaultRest: 90, sound: true, voice: true, unit: 'kg', bodyWeight: 70,
      voiceURI: '', voiceRate: 0.95, cueAudio: '', cueName: ''
    }
  };

  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) {
        var seeded = seed(clone(DEFAULT));
        try { localStorage.setItem(KEY, JSON.stringify(seeded)); } catch (e) { /* 무시 */ }
        return seeded;
      }
      var parsed = JSON.parse(raw);
      return Object.assign(clone(DEFAULT), parsed, {
        settings: Object.assign(clone(DEFAULT.settings), parsed.settings || {})
      });
    } catch (e) {
      console.warn('저장된 데이터를 읽지 못해 초기화합니다.', e);
      return clone(DEFAULT);
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      alert('저장 공간이 부족해 데이터를 저장하지 못했습니다.');
    }
    listeners.forEach(function (fn) { fn(state); });
  }

 *   실제로 들어올린 일(무게 × 가동거리 × 횟수)을 그 위에 더한다.
 *   시간형 운동(플랭크·유산소)은 해당 시간만큼 MET 차이를 더한다.
 *

 *
 * 계수는 모두 통용되는 값보다 소모가 적게 나오는 쪽으로 잡았다.

    { id: 'glutes',     ko: '둔근' },
    { id: 'quads',      ko: '대퇴사두' },

    ['대흉근', 'chest'],
    ['광배', 'lats'], ['대원', 'lats'],
    ['능형', 'traps'], ['승모', 'traps'],
    ['삼각', 'shoulders'], ['회전근개', 'shoulders'],
    ['이두', 'biceps'],
    ['삼두', 'triceps'],
    ['전완', 'forearms'], ['상완요골', 'forearms'],
    ['복직', 'abs'], ['하복부', 'abs'], ['복횡', 'abs'], ['코어', 'abs'], ['고관절굴곡', 'abs'],
    ['복사', 'obliques'],
    ['척추기립', 'lowerback'],
    ['둔근', 'glutes'],
    ['대퇴사두', 'quads'], ['내전근', 'quads'],
    ['햄스트링', 'hamstrings'],
    ['비복', 'calves'], ['가자미', 'calves']

    '팔': ['biceps', 'triceps'], '하체': ['quads', 'hamstrings', 'glutes'],

      m = String(m).trim();
      if (m === '전신') {
        FULL_BODY.forEach(function (g) { out[g] = Math.max(out[g] || 0, SECONDARY); });
        return;

      var g = groupOf(m);
      if (!g) return;
      var w = idx === 0 ? PRIMARY : SECONDARY;
      out[g] = Math.max(out[g] || 0, w);

    var used = 0;

      if (s.startedAt < since) return;

      s.items.forEach(function (it) {

        var vol = it.sets.reduce(function (a, st) {
          if (it.type === 'time') return a;
          return a + (Number(st.reps) || 0) * (Number(st.weight) || 0);

  // 단일 색조(파랑) 순차 램프. 어두운 배경이라 값이 클수록 밝아진다.

      var fill = colorFor(load.sets, data.max);
      var cls = 'bm-m' +

        (selected === g.id ? ' bm-on' : '');
      return '<g class="' + cls + '" data-act="bm-sel" data-m="' + g.id + '" fill="' + fill + '">' +
        '<title>' + g.ko + ' · ' + fmtSets(load.sets) + '세트</title>' +
        d.map(function (p) { return '<path d="' + p + '"/>'; }).join('') + '</g>';
    }).join('');

    return '<svg class="bm-svg" viewBox="' + F.viewBox[view] + '" role="img" ' +
      'aria-label="' + (view === 'front' ? '앞모습' : '뒷모습') + ' 부위별 운동량">' +
      '<g class="bm-skin">' +
        (paths.skin || []).map(function (p) { return '<path d="' + p + '"/>'; }).join('') +
      '</g>' +
      muscles +
      '</svg>';
  }

  function fmtSets(n) {
    if (!n) return '0';
    return (Math.round(n * 10) / 10).toString().replace(/\.0$/, '');
  }

  global.BodyMap = {
    GROUPS: GROUPS,
    LABEL: LABEL,
    RAMP: RAMP,
    IDLE: IDLE,
    PRIMARY: PRIMARY,
    SECONDARY: SECONDARY,
    aggregate: aggregate,
    colorFor: colorFor,
    figure: figure,
    fmtSets: fmtSets

})(window);

  function warmUpSpeech() {
    var synth = window.speechSynthesis;
    if (!synth || typeof window.SpeechSynthesisUtterance === 'undefined') return;
    try {
      var u = new window.SpeechSynthesisUtterance(' ');
      u.volume = 0;
      u.lang = 'ko-KR';
      synth.speak(u);
    } catch (e) { /* 무시 */ }
  }

  function announceRestEnd() {
    beep();
    if (!S.settings.voice) return;
    // 알림음과 겹치지 않게 잠깐 뒤에 안내한다
    setTimeout(function () {
      if (!playCue()) speak(REST_END_TEXT);
    }, 600);
  }

  // 모바일 브라우저는 사용자 조작 이후에만 소리를 낼 수 있다
  function unlockAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { /* 오디오 미지원 무시 */ }
  }
  document.addEventListener('pointerdown', function () {
    unlockAudio();
    warmUpSpeech();
  }, { once: true });

  function beep() {
    if (!S.settings.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      [0, 0.18, 0.36].forEach(function (t) {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.14);
        o.start(audioCtx.currentTime + t);
        o.stop(audioCtx.currentTime + t + 0.15);
      });
    } catch (e) { /* 오디오 미지원 무시 */ }
    try {
      if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
    } catch (e) { /* 진동 미지원 무시 */ }
  }

  function startRest(sec, label) {
    if (!sec) return;
    rest.total = sec;
    rest.remain = sec;
    rest.endsAt = Date.now() + sec * 1000;
    rest.label = label || '';
    rest.running = true;
    saveRest();
    drawRest();
  }
  function stopRest() {
    rest.running = false; rest.remain = 0; rest.endsAt = 0;
    saveRest();
    drawRest();
  }
  function tickRest(silent) {
    if (!rest.running) return;
    var left = Math.ceil((rest.endsAt - Date.now()) / 1000);
    rest.remain = Math.max(0, left);
    if (left <= 0) {
      rest.running = false;
      saveRest();
      if (!silent) { announceRestEnd(); toast('휴식 끝! 다음 세트 시작'); }
    }
    drawRest();
  }
  function adjustRest(delta) {
    if (!rest.running) return;
    rest.endsAt += delta * 1000;
    rest.total = Math.max(rest.total, Math.ceil((rest.endsAt - Date.now()) / 1000));
    saveRest();
    tickRest();
  }
  function drawRest() {
    var bar = document.getElementById('restbar');
    if (!bar) return;
    if (!rest.running) { bar.className = 'restbar'; bar.innerHTML = ''; return; }
    var pct = rest.total ? (rest.remain / rest.total) * 100 : 0;
    bar.className = 'restbar show';
    bar.innerHTML =
      '<div class="rest-fill" style="width:' + pct.toFixed(1) + '%"></div>' +
      '<div class="rest-inner">' +
        '<button class="rest-btn" data-act="rest-adj" data-v="-15">-15초</button>' +
        '<div class="rest-mid"><span class="rest-time">' + fmtClock(rest.remain) + '</span>' +
        '<span class="rest-label">휴식 · ' + esc(rest.label) + '</span></div>' +
        '<button class="rest-btn" data-act="rest-adj" data-v="15">+15초</button>' +
        '<button class="rest-btn ghost" data-act="rest-skip">건너뛰기</button>' +
      '</div>';
  }

  function tick() {
    tickRest();
    var el = document.querySelector('[data-tick="elapsed"]');
    var act = S.active();
    if (el && act) el.textContent = fmtClock((Date.now() - act.startedAt) / 1000);
  }
  setInterval(tick, 1000);

  // ── 화면 꺼짐 방지 (운동 중에만) ─────────────────────
  var wakeLock = null;
  function updateWakeLock() {
    if (!('wakeLock' in navigator)) return;
    var want = !!S.active();
    if (want && !wakeLock && document.visibilityState === 'visible') {
      navigator.wakeLock.request('screen').then(function (lock) {
        wakeLock = lock;
        lock.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () { /* 미지원·거부 시 무시 */ });
    } else if (!want && wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }

  // 앱으로 돌아왔을 때 타이머를 즉시 맞춘다
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    tick();
    updateWakeLock();
  });

  // ── 공통 UI 조각 ─────────────────────────────────────
  function header(title, right) {
    return '<header class="topbar"><h1>' + esc(title) + '</h1>' +
      '<div class="topbar-actions">' + (right || '') + '</div></header>';
  }
  function nav() {
    var items = [
      ['routines', '루틴', '📋'],
      ['session', '운동', '🏋️'],
      ['history', '기록', '📈'],
      ['settings', '설정', '⚙️']
    ];
    return '<nav class="tabbar">' + items.map(function (it) {
      var on = route.name === it[0] ? ' on' : '';
      return '<a class="tab' + on + '" href="#/' + it[0] + '">' +
        '<span class="tab-ico">' + it[2] + '</span><span>' + it[1] + '</span></a>';
    }).join('') + '</nav>';
  }
  function badge(text, cls) { return '<span class="badge ' + (cls || '') + '">' + esc(text) + '</span>'; }
  function empty(msg, sub) {
    return '<div class="empty"><div class="empty-ico">🗒️</div><p>' + esc(msg) + '</p>' +
      (sub ? '<p class="dim">' + esc(sub) + '</p>' : '') + '</div>';
  }

  function itemSummary(it) {
    if (!it.sets.length) return '세트 없음';
    if (it.type === 'time') {
      var secs = it.sets.map(function (s) { return s.sec; });
      var same = secs.every(function (v) { return v === secs[0]; });
      return it.sets.length + '세트 × ' + (same ? secs[0] + '초' : secs.join('/') + '초');
    }
    var reps = it.sets.map(function (s) { return s.reps; });
    var ws = it.sets.map(function (s) { return s.weight; });
    var sameR = reps.every(function (v) { return v === reps[0]; });
    var sameW = ws.every(function (v) { return v === ws[0]; });
    var w = sameW ? (ws[0] ? ws[0] + S.settings.unit : '맨몸') : '가변';
    return it.sets.length + '세트 × ' + (sameR ? reps[0] + '회' : reps.join('/') + '회') + ' · ' + w;
  }

  // ── 화면: 루틴 목록 ──────────────────────────────────
  function viewRoutines() {
    var routines = S.routines();
    var act = S.active();
    var html = header('내 루틴', '<button class="btn primary sm" data-act="new-routine">+ 새 루틴</button>');
    html += '<main class="page">';

    if (act) {
      var c = S.countSets(act);
      html += '<div class="card live" data-act="goto-session">' +
        '<div class="live-dot"></div>' +
        '<div><strong>진행 중: ' + esc(act.routineName) + '</strong>' +
        '<p class="dim">' + c.done + '/' + c.total + ' 세트 완료 · 이어서 하기</p></div>' +
        '<span class="chev">›</span></div>';
    }

    if (!routines.length) {
      html += empty('아직 루틴이 없습니다.', '“+ 새 루틴”으로 나만의 루틴을 만들어 보세요.');
    } else {
      html += '<ul class="list">' + routines.map(function (r) {
        var sets = r.items.reduce(function (a, it) { return a + it.sets.length; }, 0);
        return '<li class="card routine">' +
          '<div class="routine-head" data-act="edit-routine" data-id="' + r.id + '">' +
            '<div><h3>' + esc(r.name) + '</h3>' +
            '<p class="dim">' + r.items.length + '개 운동 · 총 ' + sets + '세트' +
            (r.memo ? ' · ' + esc(r.memo) : '') + '</p></div>' +
            '<span class="chev">›</span>' +
          '</div>' +
          '<div class="routine-preview">' +
            (r.items.slice(0, 4).map(function (it) { return badge(it.name); }).join('') || '<span class="dim">운동을 추가해 주세요</span>') +
            (r.items.length > 4 ? badge('+' + (r.items.length - 4)) : '') +
          '</div>' +
          '<div class="routine-actions">' +
            '<button class="btn primary" data-act="start-routine" data-id="' + r.id + '">운동 시작</button>' +
            '<button class="btn" data-act="edit-routine" data-id="' + r.id + '">편집</button>' +
            '<button class="btn" data-act="dup-routine" data-id="' + r.id + '">복제</button>' +
            '<button class="btn danger" data-act="del-routine" data-id="' + r.id + '">삭제</button>' +
          '</div>' +
        '</li>';
      }).join('') + '</ul>';
    }
    html += '</main>';
    return html;
  }

  // ── 화면: 루틴 편집 ──────────────────────────────────
  var openItems = {}; // 펼쳐진 항목 id

  function viewRoutineEdit(id) {
    var r = S.getRoutine(id);
    if (!r) return header('루틴', '') + '<main class="page">' + empty('루틴을 찾을 수 없습니다.') + '</main>';

    var html = header('루틴 편집',
      '<button class="btn sm" data-act="back">‹ 목록</button>');
    html += '<main class="page">';
    html += '<div class="card">' +
      '<label class="field"><span>루틴 이름</span>' +
      '<input type="text" data-bind="routine-name" data-id="' + r.id + '" value="' + esc(r.name) + '" placeholder="예: 월요일 가슴날"></label>' +
      '<label class="field"><span>메모</span>' +
      '<input type="text" data-bind="routine-memo" data-id="' + r.id + '" value="' + esc(r.memo || '') + '" placeholder="예: 상체 위주, 무게 천천히 증량"></label>' +
      '</div>';

    if (!r.items.length) {
      html += empty('운동이 비어 있습니다.', '아래 “운동 추가”로 머신 · 프리웨이트를 검색해 담아보세요.');
    } else {
      html += '<ul class="list">' + r.items.map(function (it, idx) {
        var ex = S.findExercise(it.exerciseId);
        var open = !!openItems[it.id];
        return '<li class="card item' + (open ? ' open' : '') + '">' +
          '<div class="item-head" data-act="toggle-item" data-id="' + it.id + '">' +
            '<div class="item-no">' + (idx + 1) + '</div>' +
            '<div class="item-main">' +
              '<h3>' + esc(it.name) + '</h3>' +
              '<p class="dim" data-summary="' + it.id + '">' + esc(itemSummary(it)) +
              ' · 휴식 ' + it.restSec + '초' + '</p>' +
              (ex ? '<div class="tags">' + badge(ex.part, 'part') + badge(ex.equip, 'equip') + '</div>' : '') +
            '</div>' +
            '<span class="chev">' + (open ? '⌄' : '›') + '</span>' +
          '</div>' +
          (open ? itemEditor(r, it) : '') +
        '</li>';
      }).join('') + '</ul>';
    }

    html += '<div class="stack">' +
      '<button class="btn block" data-act="open-picker" data-id="' + r.id + '">+ 운동 추가</button>' +
      '<button class="btn primary block" data-act="start-routine" data-id="' + r.id + '">이 루틴으로 운동 시작</button>' +
      '</div>';
    html += '</main>';
    return html;
  }

  function itemEditor(r, it) {
    var unit = S.settings.unit;
    var rows = it.sets.map(function (st, i) {
      var fields = it.type === 'time'
        ? '<label class="mini"><input type="number" inputmode="numeric" min="0" step="5" value="' + num(st.sec, 0) + '" ' +
            'data-bind="set-sec" data-rid="' + r.id + '" data-iid="' + it.id + '" data-si="' + i + '"><span>초</span></label>'
        : '<label class="mini"><input type="number" inputmode="decimal" min="0" step="0.5" value="' + num(st.weight, 0) + '" ' +
            'data-bind="set-weight" data-rid="' + r.id + '" data-iid="' + it.id + '" data-si="' + i + '"><span>' + unit + '</span></label>' +
          '<span class="x">×</span>' +
          '<label class="mini"><input type="number" inputmode="numeric" min="0" step="1" value="' + num(st.reps, 0) + '" ' +
            'data-bind="set-reps" data-rid="' + r.id + '" data-iid="' + it.id + '" data-si="' + i + '"><span>회</span></label>';
      return '<div class="setrow">' +
        '<span class="setno">' + (i + 1) + '세트</span>' + fields +
        '<button class="icon danger" title="세트 삭제" data-act="del-set" data-rid="' + r.id + '" data-iid="' + it.id + '" data-si="' + i + '">✕</button>' +
        '</div>';
    }).join('');

    return '<div class="item-body">' +
      '<div class="setlist">' + rows + '</div>' +
      '<div class="row gap">' +
        '<button class="btn sm" data-act="add-set" data-rid="' + r.id + '" data-iid="' + it.id + '">+ 세트 추가</button>' +
        '<button class="btn sm" data-act="fill-sets" data-rid="' + r.id + '" data-iid="' + it.id + '">1세트 값으로 전체 채우기</button>' +
      '</div>' +
      '<div class="row gap wrap">' +
        '<label class="field inline"><span>휴식(초)</span>' +
          '<input type="number" inputmode="numeric" min="0" step="10" value="' + it.restSec + '" data-bind="item-rest" data-rid="' + r.id + '" data-iid="' + it.id + '"></label>' +
        '<label class="field inline grow"><span>운동 메모</span>' +
          '<input type="text" value="' + esc(it.memo || '') + '" placeholder="예: 3번 핀, 등받이 4칸" data-bind="item-memo" data-rid="' + r.id + '" data-iid="' + it.id + '"></label>' +
      '</div>' +
      '<div class="row gap">' +
        '<button class="btn sm" data-act="move-item" data-rid="' + r.id + '" data-iid="' + it.id + '" data-dir="-1">↑ 위로</button>' +
        '<button class="btn sm" data-act="move-item" data-rid="' + r.id + '" data-iid="' + it.id + '" data-dir="1">↓ 아래로</button>' +
        '<button class="btn sm danger" data-act="del-item" data-rid="' + r.id + '" data-iid="' + it.id + '">운동 삭제</button>' +
      '</div>' +
    '</div>';
  }

  // 입력 중 전체 재렌더는 포커스를 잃게 하므로 요약 줄만 갱신한다
  function refreshItemSummary(rid, iid) {
    var r = S.getRoutine(rid);
    if (!r) return;
    var it = r.items.filter(function (i) { return i.id === iid; })[0];
    if (!it) return;
    var el = document.querySelector('[data-summary="' + iid + '"]');
    if (el) el.textContent = itemSummary(it) + ' · 휴식 ' + it.restSec + '초';
  }

  // ── 화면: 운동 진행 ──────────────────────────────────
  function viewSession() {
    var s = S.active();
    if (!s) {
      var routines = S.routines();
      return header('운동') + '<main class="page">' +
        empty('진행 중인 운동이 없습니다.', '루틴을 골라 시작해 보세요.') +
        (routines.length ? '<ul class="list">' + routines.map(function (r) {
          return '<li class="card row between">' +
            '<div><strong>' + esc(r.name) + '</strong><p class="dim">' + r.items.length + '개 운동</p></div>' +
            '<button class="btn primary" data-act="start-routine" data-id="' + r.id + '">시작</button></li>';
        }).join('') + '</ul>' : '') +
        '</main>';
    }

    var c = S.countSets(s);
    var pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
    var html = header(s.routineName,
      '<button class="btn sm" data-act="cancel-session">중단</button>' +
      '<button class="btn primary sm" data-act="finish-session">운동 완료</button>');

    html += '<main class="page session">';
    html += '<div class="card progress-card">' +
      '<div class="row between"><span class="dim">경과</span><strong data-tick="elapsed">' + fmtClock((Date.now() - s.startedAt) / 1000) + '</strong></div>' +
      '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="row between"><span class="dim">' + c.done + ' / ' + c.total + ' 세트</span>' +
      '<span class="dim">' + S.volumeOf(s).toLocaleString() + S.settings.unit +
      ' · 약 ' + kcalOf(s).toLocaleString() + ' kcal</span></div>' +
      '</div>';

    html += s.items.map(function (it, idx) {
      var doneCount = it.sets.filter(function (x) { return x.done; }).length;
      var allDone = doneCount === it.sets.length && it.sets.length > 0;
      return '<section class="card exercise' + (allDone ? ' done' : '') + '">' +
        '<div class="row between">' +
          '<h3>' + (idx + 1) + '. ' + esc(it.name) + (allDone ? ' ✅' : '') + '</h3>' +
          '<span class="dim">' + doneCount + '/' + it.sets.length + '</span>' +
        '</div>' +
        (it.memo ? '<p class="dim memo">📝 ' + esc(it.memo) + '</p>' : '') +
        '<div class="setlist">' + it.sets.map(function (st, i) {
          var fields = it.type === 'time'
            ? '<label class="mini"><input type="number" inputmode="numeric" min="0" step="5" value="' + num(st.sec, 0) + '" ' +
                'data-bind="live-sec" data-iid="' + it.id + '" data-si="' + i + '"><span>초</span></label>'
            : '<label class="mini"><input type="number" inputmode="decimal" min="0" step="0.5" value="' + num(st.weight, 0) + '" ' +
                'data-bind="live-weight" data-iid="' + it.id + '" data-si="' + i + '"><span>' + S.settings.unit + '</span></label>' +
              '<span class="x">×</span>' +
              '<label class="mini"><input type="number" inputmode="numeric" min="0" step="1" value="' + num(st.reps, 0) + '" ' +
                'data-bind="live-reps" data-iid="' + it.id + '" data-si="' + i + '"><span>회</span></label>';
          return '<div class="setrow live' + (st.done ? ' checked' : '') + '">' +
            '<span class="setno">' + (i + 1) + '</span>' + fields +
            '<button class="check' + (st.done ? ' on' : '') + '" data-act="toggle-set" data-iid="' + it.id + '" data-si="' + i + '" ' +
              'aria-pressed="' + (st.done ? 'true' : 'false') + '" title="세트 완료 체크">' + (st.done ? '✓' : '') + '</button>' +
            '</div>';
        }).join('') + '</div>' +
        '<div class="row gap">' +
          '<button class="btn sm" data-act="live-add-set" data-iid="' + it.id + '">+ 세트</button>' +
          '<button class="btn sm" data-act="live-del-set" data-iid="' + it.id + '">− 세트</button>' +
          '<label class="mini restedit right"><span>휴식</span>' +
            '<input type="number" inputmode="numeric" min="0" step="10" value="' + it.restSec + '" ' +
            'data-bind="live-rest" data-iid="' + it.id + '" aria-label="휴식 시간(초)"><span>초</span></label>' +
        '</div>' +
      '</section>';
    }).join('');

    html += '<button class="btn primary block lg" data-act="finish-session">운동 완료하고 기록 저장</button>';
    html += '</main>';
    return html;
  }

  function kcalOf(sess) {
    if (!window.Calories) return 0;
    return window.Calories.session(sess, S.settings.bodyWeight, function (id) {
      return S.findExercise(id);
    });
  }

  // ── 화면: 기록 ───────────────────────────────────────
  var bmSel = null;   // 근육 지도에서 선택한 부위

  function bodyMapCard(sessions) {
    var BM = window.BodyMap;
    if (!BM) return '';
    var data = BM.aggregate(sessions, 7, function (id) { return S.findExercise(id); });
    var ranked = BM.GROUPS.map(function (g) {
      return { id: g.id, ko: g.ko, sets: data.byGroup[g.id].sets, volume: data.byGroup[g.id].volume };
    }).sort(function (a, b) { return b.sets - a.sets; });

    var trained = ranked.filter(function (r) { return r.sets > 0; });
    var sel = bmSel && data.byGroup[bmSel] ? bmSel : (trained[0] ? trained[0].id : null);

    var legend = '<div class="bm-legend">' +
      '<span class="dim">적음</span>' +
      BM.RAMP.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join('') +
      '<span class="dim">많음</span>' +
      '<span class="bm-idle"><i style="background:' + BM.IDLE + '"></i>미실시</span>' +
      '</div>';

    var detail = '';
    if (sel) {
      var d = data.byGroup[sel];
      var tops = Object.keys(d.top).sort(function (a, b) { return d.top[b] - d.top[a]; }).slice(0, 3);
      detail = '<div class="bm-detail">' +
        '<div class="row between"><strong>' + esc(BM.LABEL[sel]) + '</strong>' +
        '<span class="dim">' + BM.fmtSets(d.sets) + '세트' +
        (d.volume ? ' · ' + Math.round(d.volume).toLocaleString() + S.settings.unit : '') + '</span></div>' +
        (tops.length

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function render() {
    var body;
    switch (route.name) {
      case 'routine': body = viewRoutineEdit(route.param); break;
      case 'session': body = viewSession(); break;
      case 'history': body = viewHistory(route.param); break;
      case 'settings': body = viewSettings(); break;
      default: body = viewRoutines();
    }
    app.innerHTML = body + nav() + '<div id="restbar" class="restbar"></div>';
    drawRest();
    updateWakeLock();
  }

  // ── 이벤트 위임 ──────────────────────────────────────
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.dataset.act;
    var id = t.dataset.id;
    var rid = t.dataset.rid, iid = t.dataset.iid, si = parseInt(t.dataset.si, 10);

    switch (act) {
      case 'new-routine': {
        var name = prompt('새 루틴 이름', '나의 루틴');
        if (!name) return;
        var r = S.createRoutine(name.trim());
        go('routine/' + r.id);
        break;
      }
      case 'edit-routine': go('routine/' + id); break;
      case 'back': go('routines'); break;
      case 'back-history': go('history'); break;
      case 'goto-session': go('session'); break;

      case 'dup-routine': S.duplicateRoutine(id); toast('복제했습니다'); render(); break;
      case 'del-routine':
        if (confirm('루틴을 삭제할까요? 되돌릴 수 없습니다.')) { S.deleteRoutine(id); render(); }
        break;

      case 'start-routine': {
        var rt = S.getRoutine(id);
        if (!rt || !rt.items.length) { alert('먼저 운동을 추가해 주세요.'); return; }
        if (S.active() && !confirm('진행 중인 운동이 있습니다. 새로 시작할까요? (진행 중인 기록은 사라집니다)')) return;
        S.startSession(id);
        stopRest();
        go('session');
        break;
      }

      case 'toggle-item':
        openItems[t.dataset.id] = !openItems[t.dataset.id];
        render();
        break;

      case 'open-picker': openPicker(id); break;
      case 'close-modal': closeModal(); break;
      case 'pk-filter':
        picker[t.dataset.key] = t.dataset.v;
        updatePicker();
        break;
      case 'pk-add': {
        var ex = S.findExercise(t.dataset.id);
        if (!ex) return;
        S.addItem(picker.routineId, ex, { sets: picker.sets, reps: picker.reps });
        toast('“' + ex.name + '” 추가됨');
        render();
        break;
      }
      case 'pk-custom': customExerciseForm(); break;

      case 'add-set': {
        var r2 = S.getRoutine(rid);
        var it2 = r2.items.filter(function (i) { return i.id === iid; })[0];
        var last = it2.sets[it2.sets.length - 1];
        it2.sets.push(last ? Object.assign({}, last) : (it2.type === 'time' ? { sec: 60 } : { reps: 10, weight: 0 }));
        S.commit(); render();
        break;
      }
      case 'del-set': {
        var r3 = S.getRoutine(rid);
        var it3 = r3.items.filter(function (i) { return i.id === iid; })[0];
        if (it3.sets.length <= 1) { toast('최소 1세트는 필요합니다'); return; }
        it3.sets.splice(si, 1);
        S.commit(); render();
        break;
      }
      case 'fill-sets': {
        var r4 = S.getRoutine(rid);
        var it4 = r4.items.filter(function (i) { return i.id === iid; })[0];
        var first = it4.sets[0];
        it4.sets = it4.sets.map(function () { return Object.assign({}, first); });
        S.commit(); render(); toast('전체 세트를 1세트 값으로 맞췄습니다');
        break;
      }
      case 'move-item': S.moveItem(rid, iid, parseInt(t.dataset.dir, 10)); render(); break;
      case 'del-item':
        if (confirm('이 운동을 루틴에서 뺄까요?')) { S.removeItem(rid, iid); render(); }
        break;

      // ── 세션 ──
      case 'toggle-set': {
        var s = S.active();
        if (!s) return;
        var item = s.items.filter(function (i) { return i.id === iid; })[0];
        var st = item.sets[si];
        st.done = !st.done;
        st.doneAt = st.done ? Date.now() : null;
        S.commit();
        if (st.done) {
          if (item.restSec) startRest(item.restSec, item.name + ' ' + (si + 1) + '세트 완료');
          else beep();
        }
        render();
        break;
      }
      case 'live-add-set': {
        S.updateActive(function (s) {
          var it = s.items.filter(function (i) { return i.id === iid; })[0];
          var last = it.sets[it.sets.length - 1];
          it.sets.push(Object.assign({}, last || (it.type === 'time' ? { sec: 60 } : { reps: 10, weight: 0 }),
            { done: false, doneAt: null }));
        });
        render();
        break;
      }
      case 'live-del-set': {
        S.updateActive(function (s) {
          var it = s.items.filter(function (i) { return i.id === iid; })[0];
          if (it.sets.length > 1) it.sets.pop();
        });
        render();
        break;
      }
      case 'rest-adj': adjustRest(parseInt(t.dataset.v, 10)); break;
      case 'rest-skip': stopRest(); break;
      case 'cancel-session':
        if (confirm('진행 중인 운동을 중단할까요? 기록이 저장되지 않습니다.')) {
          S.cancelSession(); stopRest(); go('routines'); render();
        }
        break;
      case 'finish-session': {
        var cur = S.active();
        if (!cur) return;
        var cnt = S.countSets(cur);
        if (!cnt.done) {
          if (!confirm('완료한 세트가 없습니다. 기록 없이 종료할까요?')) return;
          S.cancelSession(); stopRest(); go('routines'); render(); return;
        }
        if (cnt.done < cnt.total && !confirm('남은 세트가 ' + (cnt.total - cnt.done) + '개 있습니다. 지금 완료할까요?')) return;
        var saved = S.finishSession();
        stopRest();
        toast('기록을 저장했습니다');
        go(saved ? 'history/' + saved.id : 'history');
        break;
      }

      // ── 기록 ──
      case 'bm-sel':
        bmSel = (bmSel === t.dataset.m) ? null : t.dataset.m;
        render();
        break;
      case 'open-history': go('history/' + id); break;
      case 'del-history':
        if (confirm('이 기록을 삭제할까요?')) { S.deleteSession(id); go('history'); }
        break;

      // ── 설정 ──
      case 'check-update': {
        toast('최신 버전을 확인합니다');
        var reload = function () { location.reload(); };
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
          navigator.serviceWorker.getRegistration()
            .then(function (reg) { return reg ? reg.update() : null; })
            .then(reload, reload);
        } else {
          reload();
        }
        break;
      }
      case 'voice-pick':
        S.settings.voiceURI = t.dataset.uri;
        S.commit();
        unlockAudio();
        speak(REST_END_TEXT);
        render();
        break;
      case 'voice-play':
        unlockAudio();
        speakWith(t.dataset.uri, REST_END_TEXT);
        break;
      case 'voice-test':
        unlockAudio();
        if (playCue()) break;
        if (!speak(REST_END_TEXT)) alert('이 브라우저는 음성 안내를 지원하지 않습니다.');
        else if (!currentVoice()) toast('한국어 음성이 없어 기본 목소리로 재생합니다');
        break;
      case 'cue-record':
        unlockAudio();
        if (recording) stopRecording();
        else startRecording();
        break;
      case 'cue-pick': {
        var fi = document.createElement('input');
        fi.type = 'file';
        fi.accept = 'audio/*';
        fi.onchange = function () {
          var f = fi.files[0];
          if (!f) return;
          if (f.size > 1024 * 1024) { alert('1MB 이하의 짧은 음성 파일만 넣을 수 있습니다.'); return; }
          var reader = new FileReader();
          reader.onload = function () {
            S.settings.cueAudio = reader.result;
            S.settings.cueName = f.name;
            S.commit();
            loadCue();
            toast('안내 음성을 바꿨습니다');
            render();
          };
          reader.readAsDataURL(f);
        };
        fi.click();
        break;
      }
      case 'cue-clear':
        S.settings.cueAudio = '';
        S.settings.cueName = '';
        S.commit();
        cueBuffer = null;
        render();
        break;
      case 'del-custom':
        if (confirm('이 운동을 삭제할까요? 기존 루틴의 항목은 그대로 유지됩니다.')) {
          S.removeCustomExercise(id); render();
        }
        break;
      case 'export': openExportSheet(); break;
      case 'export-copy': {
        var text = document.getElementById('exp-json').value;
        copyText(text).then(function (ok) {
          toast(ok ? '백업 내용을 복사했습니다' : '복사 실패 — 직접 선택해 복사해 주세요');
        });
        break;
      }
      case 'export-file': {
        var blob = new Blob([S.exportJSON()], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'gymmate-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        break;
      }
      case 'import-text': {
        var text2 = prompt('백업 내용(JSON)을 붙여넣어 주세요.');
        if (!text2) return;
        try { S.importJSON(text2); toast('가져오기 완료'); closeModal(); render(); }
        catch (e) { alert('가져오기 실패: ' + e.message); }
        break;
      }
      case 'import': {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json,.json';
        input.onchange = function () {
          var f = input.files[0];
          if (!f) return;
          var reader = new FileReader();
          reader.onload = function () {
            try { S.importJSON(reader.result); toast('가져오기 완료'); render(); }
            catch (e) { alert('가져오기 실패: ' + e.message); }
          };
          reader.readAsText(f);
        };
        input.click();
        break;
      }
      case 'reset':
        if (confirm('모든 루틴과 기록이 삭제됩니다. 계속할까요?')) { S.resetAll(); go('routines'); render(); }
        break;
    }
  });

  // 입력값 반영 (입력 즉시 + 확정 시점 모두)
  function onFieldChange(ev) {
    var t = ev.target.closest('[data-bind]');
    if (!t) return;
    var bind = t.dataset.bind;
    var rid = t.dataset.rid, iid = t.dataset.iid, si = parseInt(t.dataset.si, 10);

    function editSet(fn) {
      var r = S.getRoutine(rid);
      if (!r) return;
      var it = r.items.filter(function (i) { return i.id === iid; })[0];
      if (!it || !it.sets[si]) return;
      fn(it.sets[si], it);
      S.commit();
    }
    function editLiveSet(fn) {
      S.updateActive(function (s) {
        var it = s.items.filter(function (i) { return i.id === iid; })[0];
        if (it && it.sets[si]) fn(it.sets[si]);
      });
    }

    switch (bind) {
      case 'routine-name': S.updateRoutine(t.dataset.id, { name: t.value.trim() || '이름 없는 루틴' }); break;
      case 'routine-memo': S.updateRoutine(t.dataset.id, { memo: t.value.trim() }); break;
      case 'set-weight': editSet(function (st) { st.weight = num(t.value, 0); }); refreshItemSummary(rid, iid); break;
      case 'set-reps': editSet(function (st) { st.reps = Math.max(0, Math.round(num(t.value, 0))); }); refreshItemSummary(rid, iid); break;
      case 'set-sec': editSet(function (st) { st.sec = Math.max(0, Math.round(num(t.value, 0))); }); refreshItemSummary(rid, iid); break;
      case 'item-rest':
        S.updateItem(rid, iid, { restSec: Math.max(0, Math.round(num(t.value, 0))) });
        refreshItemSummary(rid, iid);
        break;
      case 'item-memo': S.updateItem(rid, iid, { memo: t.value }); break;

      case 'live-weight': editLiveSet(function (st) { st.weight = num(t.value, 0); }); break;
      case 'live-reps': editLiveSet(function (st) { st.reps = Math.max(0, Math.round(num(t.value, 0))); }); break;
      case 'live-sec': editLiveSet(function (st) { st.sec = Math.max(0, Math.round(num(t.value, 0))); }); break;
      case 'live-rest': {
        var sec = Math.max(0, Math.round(num(t.value, 0)));
        S.updateActive(function (s) {
          var it = s.items.filter(function (i) { return i.id === iid; })[0];
          if (it) it.restSec = sec;
        });
        // 오늘 운동뿐 아니라 원래 루틴에도 반영해 다음에도 같은 값이 쓰이게 한다
        var cur = S.active();
        if (cur && S.getRoutine(cur.routineId)) S.updateItem(cur.routineId, iid, { restSec: sec });
        if (ev.type === 'change') toast('휴식 ' + sec + '초 · 루틴에도 저장됨');
        break;
      }

      case 'set-rest': S.settings.defaultRest = Math.max(0, Math.round(num(t.value, 90))); S.commit(); break;
      case 'set-unit':
        S.settings.unit = t.value; S.commit();
        if (ev.type === 'change') render();
        break;
      case 'set-sound': S.settings.sound = t.checked; S.commit(); break;
      case 'set-voice': S.settings.voice = t.checked; S.commit(); break;
      case 'set-voice-all':
        showAllVoices = t.checked;
        render();
        break;
      case 'set-voice-uri':
        S.settings.voiceURI = t.value;
        S.commit();
        if (ev.type === 'change') { unlockAudio(); speak(REST_END_TEXT); }
        break;
      case 'set-voice-rate':
        S.settings.voiceRate = Math.min(1.3, Math.max(0.7, num(t.value, 0.95)));
        S.commit();
        if (ev.type === 'change') { unlockAudio(); speak(REST_END_TEXT); render(); }
        break;
      case 'set-weight-kg':
        S.settings.bodyWeight = Math.min(250, Math.max(20, num(t.value, 70)));
        S.commit();
        break;

      case 'pk-sets': picker.sets = Math.max(1, Math.round(num(t.value, 3))); break;
      case 'pk-reps': picker.reps = Math.max(1, Math.round(num(t.value, 10))); break;
    }
  }
  document.addEventListener('change', onFieldChange);
  document.addEventListener('input', onFieldChange);

  // 검색어는 입력 즉시 반영 (입력창은 건드리지 않아 한글 조합이 유지된다)
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.bind === 'pk-q') {
      picker.q = t.value;
      updatePicker();
    }
  });
  // 한글·일본어 등 조합 입력이 확정되는 순간에도 한 번 갱신
  document.addEventListener('compositionend', function (ev) {
    var t = ev.target;
    if (t && t.dataset && t.dataset.bind === 'pk-q') {
      picker.q = t.value;
      updatePicker();
    }
  });

  // 진행 중 운동이 있으면 실수로 창을 닫지 않도록 경고
  window.addEventListener('beforeunload', function (e) {
    if (S.active() && S.countSets(S.active()).done > 0) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // 시작
  route = parseHash();
  if (!location.hash) location.hash = '#/routines';
  restoreRest();
  render();
  if (S.settings.cueAudio) {
    document.addEventListener('pointerdown', loadCue, { once: true });
  }
})();

</script>
</body>
</html>
