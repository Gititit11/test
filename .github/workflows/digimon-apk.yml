# 디지타마는 Gititit11/digitama 로 옮겼다.
# 이 레포에 남은 옛 APK 주소(릴리스 digitama-latest)를 끊는다. 한 번 돌고 나면 이 파일도 지운다.
name: 디지타마 옛 릴리스 지우기

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/digimon-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: 릴리스와 태그 지우기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view digitama-latest >/dev/null 2>&1; then
            gh release delete digitama-latest --cleanup-tag --yes
          fi
          # 릴리스 없이 태그만 남은 경우
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/digitama-latest" 2>/dev/null || true
          gh release view digitama-latest >/dev/null 2>&1 && exit 1 || echo "옛 릴리스 없음"
