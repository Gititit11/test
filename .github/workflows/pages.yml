# GitHub Pages 로 배포 → 안드로이드에서 https 주소로 열고 "홈 화면에 추가" 가능
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/health-routine-workout-app-tww9lp
      - claude/water-intake-tracker-app-gq6aat
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Pages 가 아직 켜져 있지 않아도 워크플로가 직접 켜도록 한다
          enablement: true
      - name: 정적 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
